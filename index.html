/* ==========================================================
   AudioContext生成
========================================================== */

function createAudioContext() {

    if (audioContext) {
        return audioContext;
    }

    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContextClass) {

        throw new Error(
            'このブラウザはWeb Audio APIに対応していません。'
        );

    }

    /*
     * iPadではAudioContextの生成タイミングが重要。
     * ログイン・再生などのユーザー操作から呼び出す。
     */

    audioContext = new AudioContextClass();

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        masterVolume;

    masterGain.connect(
        audioContext.destination
    );

    console.log(
        '[Audio] AudioContext created',
        {
            state: audioContext.state,
            sampleRate: audioContext.sampleRate
        }
    );

    return audioContext;
}


/* ==========================================================
   AudioContextを確実に再開
========================================================== */

async function ensureAudioContextRunning() {

    const ctx =
        createAudioContext();

    console.log(
        '[Audio] before resume:',
        ctx.state
    );

    if (ctx.state !== 'running') {

        try {

            await ctx.resume();

        } catch (error) {

            console.error(
                '[Audio] resume failed',
                error
            );

            throw new Error(
                '音声システムを起動できませんでした。もう一度再生ボタンを押してください。'
            );
        }

    }

    console.log(
        '[Audio] after resume:',
        ctx.state
    );


    /*
     * iOS/Safari用のAudioContextアンロック。
     *
     * 無音のOscillatorをユーザー操作中に
     * 一瞬だけ起動する。
     */

    try {

        const oscillator =
            ctx.createOscillator();

        const silentGain =
            ctx.createGain();

        silentGain.gain.value = 0;

        oscillator.connect(
            silentGain
        );

        silentGain.connect(
            ctx.destination
        );

        const startTime =
            ctx.currentTime;

        oscillator.start(
            startTime
        );

        oscillator.stop(
            startTime + 0.01
        );

    } catch (error) {

        console.warn(
            '[Audio] silent unlock failed',
            error
        );

    }

    return ctx;
}

/* ==========================================================
   音声ファイル取得
========================================================== */

async function fetchAudioData(path) {

    if (rawAudioCache.has(path)) {

        return rawAudioCache.get(path);

    }


    console.log(
        '[Audio] loading:',
        path
    );


    const response =
        await fetch(
            encodeURI(path),
            {
                cache: 'force-cache'
            }
        );


    if (!response.ok) {

        throw new Error(
            `${path} の読み込みに失敗しました。HTTP ${response.status}`
        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    if (!arrayBuffer ||
        arrayBuffer.byteLength === 0) {

        throw new Error(
            `${path} のデータが空です。`
        );

    }


    rawAudioCache.set(
        path,
        arrayBuffer
    );


    console.log(
        '[Audio] loaded:',
        path,
        `${Math.round(arrayBuffer.byteLength / 1024)} KB`
    );


    return arrayBuffer;
}


/* ==========================================================
   1ファイルをデコード
========================================================== */

async function decodeAudioFile(item) {

    const path = item.path;


    if (decodedAudioCache.has(path)) {

        return decodedAudioCache.get(path);

    }


    const ctx =
        audioContext;


    if (!ctx) {

        throw new Error(
            'AudioContextが初期化されていません。'
        );

    }


    const arrayBuffer =
        await fetchAudioData(path);


    /*
     * decodeAudioDataはArrayBufferの内容を
     * AudioBufferへ変換する。
     */

    const audioBuffer =
        await ctx.decodeAudioData(
            arrayBuffer.slice(0)
        );


    if (!audioBuffer ||
        audioBuffer.length === 0) {

        throw new Error(
            `${path} のデコード結果が空です。`
        );

    }


    decodedAudioCache.set(
        path,
        audioBuffer
    );


    console.log(
        '[Audio] decoded:',
        path,
        {
            duration: audioBuffer.duration,
            channels: audioBuffer.numberOfChannels,
            sampleRate: audioBuffer.sampleRate
        }
    );


    return audioBuffer;
}

            try {

                    '準備中',
                    'indigo'
                );


                const items =
                    getAllAudioItems();


                /*
                 * iPadでは一気にdecodeすると負荷が高くなる
                 * 可能性があるため、順番に処理する。
                 */

                for (
                    let i = 0;
                    i < items.length;
                    i++
                ) {

                    const item =
                        items[i];


                    await decodeAudioFile(
                        item
                    );


                    console.log(
                        `[Audio] preparation ${i + 1}/${items.length}`
                    );

                }


                console.log(
                    '[Audio] ALL AUDIO PREPARED'
                );


                setStatus(
                    '音声準備完了',
                    'emerald'
                );


                return true;

            } catch (error) {

                console.error(
                    '[Audio] preparation failed:',
                    error
                );


                audioPreparationPromise =
                    null;


                setStatus(
                    '準備エラー',
                    'rose'
                );


                throw error;

            }

        })();


    return audioPreparationPromise;
}


/* ==========================================================
   選択されたキュー
========================================================== */

function buildPlayQueue() {

    const queue = [];


    queue.push(
        fixedAudios['1']
    );


    if (selectedCause) {

        queue.push(
            selectedCause
        );

    }


    queue.push(
        fixedAudios['2']
    );


    if (selectedSections[0]) {

        queue.push(
            selectedSections[0]
        );

    }


    queue.push(
        fixedAudios['3']
    );


    if (selectedSections[1]) {

        queue.push(
            selectedSections[1]
        );

    }


    queue.push(
        fixedAudios['4']
    );


    if (selectedStatus) {

        queue.push(
            selectedStatus
        );

    }


    return queue;
}


/* ==========================================================
   選択完了判定
========================================================== */

function isSelectionComplete() {

    return (
        selectedCause !== null &&
        selectedSections.length === 2 &&
        selectedStatus !== null
    );

}


/* ==========================================================
   選択された音声だけを結合
========================================================== */

function createCombinedAudioBuffer(queue) {

    const ctx =
        audioContext;


    if (!ctx) {

        throw new Error(
            'AudioContextがありません。'
        );

    }


    const buffers =
        queue.map(item => {

            const buffer =
                decodedAudioCache.get(
                    item.path
                );

            if (!buffer) {

                throw new Error(
                    `${item.path} がデコードされていません。`
                );

            }

            return buffer;

        });


    /*
     * 最大チャンネル数を使用。
     *
     * MP3によってモノラル/ステレオが混在していても
     * 1本のAudioBufferにまとめられるようにする。
     */

    let numberOfChannels = 1;

    buffers.forEach(buffer => {

        numberOfChannels =
            Math.max(
                numberOfChannels,
                buffer.numberOfChannels
            );

    });


    /*
     * AudioContextのサンプルレートは
     * decodeAudioDataによって統一されている。
     */

    const sampleRate =
        ctx.sampleRate;


    let totalLength = 0;


    buffers.forEach(buffer => {

        totalLength +=
            buffer.length;

    });


    console.log(
        '[Audio] create combined buffer',
        {
            channels: numberOfChannels,
            sampleRate,
            samples: totalLength,
            duration: totalLength / sampleRate
        }
    );


    const combined =
        ctx.createBuffer(
            numberOfChannels,
            totalLength,
            sampleRate
        );


    /*
     * 再生中の表示用。
     * 各音声が結合バッファのどこから始まるかを保存。
     */

    const segments = [];

    let offset = 0;


    buffers.forEach(
        (buffer, index) => {

            const start =
                offset;


            /*
             * チャンネルごとにコピー。
             */

            for (
                let channel = 0;
                channel < numberOfChannels;
                channel++
            ) {

                const destination =
                    combined.getChannelData(
                        channel
                    );


                if (
                    channel <
                    buffer.numberOfChannels
                ) {

                    const source =
                        buffer.getChannelData(
                            channel
                        );


                    destination.set(
                        source,
                        offset
                    );

                }

            }


            offset +=
                buffer.length;


            segments.push({

                item: queue[index],

                start:
                    start / sampleRate,

                end:
                    offset / sampleRate

            });

        }
    );


    return {
        buffer: combined,
        segments
    };

}


/* ==========================================================
   結合バッファを準備
========================================================== */

function prepareCombinedBuffer(queue) {

    const result =
        createCombinedAudioBuffer(
            queue
        );


    combinedBuffer =
        result.buffer;


    combinedSegments =
        result.segments;


    playbackDuration =
        combinedBuffer.duration;


    console.log(
        '[Audio] combined buffer ready',
        {
            duration: playbackDuration,
            segments: combinedSegments
        }
    );

}


/* ==========================================================
   再生中の音声を判定
========================================================== */

function updateCurrentSegment() {

    if (
        !isPlayingQueue ||
        !combinedBuffer
    ) {

        return;

    }


    const elapsed =
        audioContext.currentTime -
        playbackStartedAt;


    let currentIndex = -1;


    for (
        let i = 0;
        i < combinedSegments.length;
        i++
    ) {

        const segment =
            combinedSegments[i];


        if (
            elapsed >= segment.start &&
            elapsed < segment.end
        ) {

            currentIndex = i;

            break;

        }

    }


    if (currentIndex >= 0) {

        const segment =
            combinedSegments[currentIndex];


        currentPlayingLabel.textContent =
            `再生中 (${currentIndex + 1}/${combinedSegments.length}): ${segment.item.id}`;


        queueProgressCount.textContent =
            `${currentIndex + 1} / ${combinedSegments.length}`;

    }


    const progress =
        Math.min(
            1,
            Math.max(
                0,
                elapsed / playbackDuration
            )
        );


    queueProgressBar.style.width =
        `${progress * 100}%`;

}


/* ==========================================================
   再生開始
========================================================== */

async function playQueueSequence() {

    if (isPlayingQueue) {
        return;
    }


    if (!isSelectionComplete()) {

        showMessage(
            '原因・区間2つ・状況を選択してください。'
        );

        return;

    }


    /*
     * 非同期処理の前に、ユーザー操作から直接
     * AudioContextをresumeする。
     *
     * ここがiPad対策の最重要部分。
     */

    try {

        await ensureAudioContextRunning();

    } catch (error) {

        showMessage(
            error.message
        );

        return;

    }


    const session =
        ++playbackSessionId;


    try {

        setStatus(
            '音声準備中',
            'amber'
        );


        currentPlayingLabel.textContent =
            '音声データを準備しています...';


        /*
         * まだ全音声がデコードされていない場合。
         */

        await prepareAllAudios();


        /*
         * stopなどが途中で実行されていた場合は
         * 古い処理を破棄。
         */

        if (
            session !== playbackSessionId
        ) {

            return;

        }


        const queue =
            buildPlayQueue();


        prepareCombinedBuffer(
            queue
        );


        /*
         * 再生開始直前にもresumeを確認。
         */

        await ensureAudioContextRunning();


        if (
            session !== playbackSessionId
        ) {

            return;

        }


        startCombinedBuffer(
            session
        );


    } catch (error) {

        console.error(
            '[Audio] PLAY ERROR:',
            error
        );


        isPlayingQueue = false;


        showMessage(
            `音声の準備・再生に失敗しました: ${error.message}`
        );


        setStatus(
            '準備エラー',
            'rose'
        );


        resetPlayerUI();

    }

}


/* ==========================================================
   1本のAudioBufferとして再生
========================================================== */

function startCombinedBuffer(session) {

    if (
        !combinedBuffer ||
        !audioContext ||
        !masterGain
    ) {

        throw new Error(
            '再生用AudioBufferが準備されていません。'
        );

    }


    if (
        audioContext.state !== 'running'
    ) {

        throw new Error(
            `AudioContextがrunningではありません: ${audioContext.state}`
        );

    }


    /*
     * 念のため以前のsourceを停止。
     */

    if (currentSource) {

        try {
            currentSource.stop();
        } catch (e) {}

        currentSource.disconnect();

        currentSource = null;

    }


    const source =
        audioContext.createBufferSource();


    source.buffer =
        combinedBuffer;


    source.connect(
        masterGain
    );


    currentSource =
        source;


    isPlayingQueue = true;


    setStatus(
        '再生中',
        'emerald'
    );


    playQueueBtn.disabled =
        true;


    stopQueueBtn.disabled =
        false;


    playQueueIcon.className =
        'fa-solid fa-rotate animate-spin text-xl';


    queueProgressBar.style.width =
        '0%';


    /*
     * AudioContext上の正確な再生開始時刻。
     */

    playbackStartedAt =
        audioContext.currentTime;


    /*
     * ここで1回だけstart。
     *
     * 個別Audio要素を連続再生する方式ではないため、
     * onended → 次のAudio.play()
     * のような隙間が発生しない。
     */

    source.start(
        playbackStartedAt
    );


    source.onended = () => {

        /*
         * 古い再生セッションなら無視。
         */

        if (
            session !== playbackSessionId
        ) {

            return;

        }


        if (!isPlayingQueue) {

            return;

        }


        currentSource = null;


        if (isLoopEnabled) {

            startLoopWait();

        } else {

            finishQueue();

        }

    };


    /*
     * iOS Safari対策。
     *
     * setIntervalでUIだけ更新。
     * 音声そのものはAudioContextに任せる。
     */

    startProgressTimer(
        session
    );


    console.log(
        '[Audio] PLAY START',
        {
            state: audioContext.state,
            duration: combinedBuffer.duration,
            sampleRate: audioContext.sampleRate
        }
    );

}


/* ==========================================================
   進捗タイマー
========================================================== */

let progressTimerId = null;

function startProgressTimer(session) {

    stopProgressTimer();


    progressTimerId =
        setInterval(() => {

            if (
                !isPlayingQueue ||
                session !== playbackSessionId
            ) {

                stopProgressTimer();

                return;

            }


            /*
             * AudioContextのcurrentTimeを使用。
             *
             * setIntervalの遅延に影響されにくい。
             */

            updateCurrentSegment();


        }, 100);

}


function stopProgressTimer() {

    if (progressTimerId) {

        clearInterval(
            progressTimerId
        );

        progressTimerId = null;

    }

}


/* ==========================================================
   再生完了
========================================================== */

function finishQueue() {

    isPlayingQueue = false;


    stopProgressTimer();

    clearLoopTimers();


    if (currentSource) {

        try {
            currentSource.disconnect();
        } catch (e) {}

        currentSource = null;

    }


    playQueueIcon.className =
        'fa-solid fa-play text-xl ml-0.5';


    stopQueueBtn.disabled =
        true;


    if (isSelectionComplete()) {

        playQueueBtn.disabled =
            false;

    }


    currentPlayingLabel.textContent =
        '再生完了！';


    queueProgressBar.style.width =
        '100%';


    const queue =
        buildPlayQueue();


    queueProgressCount.textContent =
        `${queue.length} / ${queue.length}`;


    setStatus(
        '完了',
        'indigo'
    );


    console.log(
        '[Audio] PLAY FINISHED'
    );

}


/* ==========================================================
   ループ待機
========================================================== */

function startLoopWait() {

    if (!isPlayingQueue) {
        return;
    }


    stopProgressTimer();

    clearLoopTimers();


    remainingCountdown =
        loopIntervalSeconds;


    setStatus(
        'ループ待機中',
        'amber'
    );


    if (
        remainingCountdown <= 0
    ) {

        restartQueue();

        return;

    }


    updateCountdownLabel();


    countdownTimerId =
        setInterval(() => {

            if (!isPlayingQueue) {

                clearLoopTimers();

                return;

            }


            remainingCountdown--;


            if (
                remainingCountdown <= 0
            ) {

                clearLoopTimers();

                restartQueue();

            } else {

                updateCountdownLabel();

            }

        }, 1000);

}


/* ==========================================================
   ループ再生
========================================================== */

function restartQueue() {

    if (!isPlayingQueue) {
        return;
    }


    clearLoopTimers();


    /*
     * 既にAudioContext上でデコード済みの
     * combinedBufferを再利用する。
     */

    try {

        ensureAudioContextRunning()
            .then(() => {

                if (!isPlayingQueue) {
                    return;
                }


                /*
                 * 新しいAudioBufferSourceNodeを作る。
                 *
                 * AudioBufferSourceNodeは一度startすると
                 * 再利用できないため、sourceだけ新しくする。
                 */

                const session =
                    playbackSessionId;


                startCombinedBuffer(
                    session
                );

            })
            .catch(error => {

                console.error(
                    '[Audio] loop resume error',
                    error
                );

                stopQueue();

            });

    } catch (error) {

        console.error(
            '[Audio] loop restart error',
            error
        );

        stopQueue();

    }

}


/* ==========================================================
   カウントダウン
========================================================== */

function updateCountdownLabel() {

    currentPlayingLabel.textContent =
        `ループ再生待機中 (${remainingCountdown}秒後に再再生)...`;

}


/* ==========================================================
   タイマー解除
========================================================== */

function clearLoopTimers() {

    if (countdownTimerId) {

        clearInterval(
            countdownTimerId
        );

        countdownTimerId = null;

    }

}


/* ==========================================================
   停止
========================================================== */

function stopQueue() {

    /*
     * セッションを無効化。
     */

    playbackSessionId++;


    isPlayingQueue = false;


    stopProgressTimer();

    clearLoopTimers();


    if (currentSource) {

        try {

            currentSource.stop();

        } catch (e) {}


        try {

            currentSource.disconnect();

        } catch (e) {}


        currentSource = null;

    }


    playQueueIcon.className =
        'fa-solid fa-play text-xl ml-0.5';


    stopQueueBtn.disabled =
        true;


    playQueueBtn.disabled =
        !isSelectionComplete();


    currentPlayingLabel.textContent =
        '再生停止';


    queueProgressBar.style.width =
        '0%';


    const queue =
        buildPlayQueue();


    queueProgressCount.textContent =
        `0 / ${queue.length}`;


    setStatus(
        '準備完了',
        'indigo'
    );


    console.log(
        '[Audio] STOP'
    );

}


/* ==========================================================
   プレイヤーUI
========================================================== */

function resetPlayerUI() {

    playQueueIcon.className =
        'fa-solid fa-play text-xl ml-0.5';


    stopQueueBtn.disabled =
        true;


    playQueueBtn.disabled =
        !isSelectionComplete();

}

   ステータス表示

function setStatus(text, color) {

    const colors = {

/* ==========================================================
   カテゴリ表示
========================================================== */

function renderCategoryButtons() {

    renderGroup(
        categories.cause,
        categoryCauseContainer,
        'cause'
    );


    renderGroup(
        categories.section,
        categorySectionContainer,
        'section'
    );


    renderGroup(
        categories.status,
        categoryStatusContainer,
        'status'
    );

}


function renderGroup(
    items,
    container,
    groupType
) {

    container.innerHTML = '';


    items.forEach(item => {

        const btn =
            document.createElement('button');


        const isSelected =
            isItemSelected(
                groupType,
                item
            );


        btn.className =
            `p-2.5 rounded-xl border text-center font-bold
             transition-all transform active:scale-95 ${
                isSelected
                    ? `bg-gradient-to-tr ${item.color}
                       border-white text-white shadow-lg
                       ring-2 ring-indigo-400`
                    : `bg-slate-800/80 border-slate-700/60
                       text-slate-300 hover:bg-slate-700/80`
             }`;


        btn.innerHTML =
            `<div class="text-xs sm:text-sm font-black truncate">
                ${item.id}
             </div>`;


        btn.addEventListener(
            'click',
            () => handleSelect(
                groupType,
                item
            )
        );


        container.appendChild(btn);

    });

}


function isItemSelected(
    groupType,
    item
) {

    if (
        groupType === 'cause'
    ) {

        return (
            selectedCause?.id === item.id
        );

    }


    if (
        groupType === 'section'
    ) {

        return selectedSections.some(
            s => s.id === item.id
        );

    }


    if (
        groupType === 'status'
    ) {

        return (
            selectedStatus?.id === item.id
        );

    }


    return false;

}


/* ==========================================================
   選択
========================================================== */

function handleSelect(
    groupType,
    item
) {

    if (isPlayingQueue) {

        showMessage(
            '再生中は選択を変更できません。'
        );

        return;

    }


    if (
        groupType === 'cause'
    ) {

        selectedCause =
            selectedCause?.id === item.id
                ? null
                : item;

    }


    else if (
        groupType === 'section'
    ) {

        const index =
            selectedSections.findIndex(
                s => s.id === item.id
            );


        if (index >= 0) {

            selectedSections.splice(
                index,
                1
            );

        } else {

            if (
                selectedSections.length >= 2
            ) {

                selectedSections.shift();

            }

            selectedSections.push(item);

        }

    }


    else if (
        groupType === 'status'
    ) {

        selectedStatus =
            selectedStatus?.id === item.id
                ? null
                : item;

    }


    /*
     * 選択内容が変わったので、
     * 結合済みバッファを破棄。
     */

    combinedBuffer = null;

    combinedSegments = [];


    renderCategoryButtons();

    updateSequenceUI();

}


/* ==========================================================
   シーケンス表示
========================================================== */

function updateSequenceUI() {

    sequenceDisplay.innerHTML = '';


    const queue =
        buildPlayQueue();


    queue.forEach(
        (item, index) => {

            const isFixed =
                Object.values(
                    fixedAudios
                ).includes(item);


            const pill =
                document.createElement('div');


            pill.className =
                `flex items-center gap-1.5
                 px-3 py-1.5 rounded-xl
                 text-xs font-semibold shadow-sm border ${
                    isFixed
                        ? 'bg-slate-800/90 border-slate-600 text-slate-300'
                        : 'bg-indigo-600/30 border-indigo-500/50 text-indigo-200'
                 }`;


            pill.innerHTML =
                `<span class="text-[10px] text-slate-400 font-mono">
                    ${index + 1}.
                 </span>
                 <span>${item.id}</span>`;


            sequenceDisplay.appendChild(
                pill
            );

        }
    );


    const ready =
        isSelectionComplete();


    if (ready) {

        if (!isPlayingQueue) {

            playQueueBtn.disabled =
                false;

        }


        currentPlayingLabel.textContent =
            '再生準備完了';


    } else {

        playQueueBtn.disabled =
            true;


        currentPlayingLabel.textContent =
            '原因(1つ)、区間(2つ)、状況(1つ)を選択してください';

    }


    queueProgressCount.textContent =
        `0 / ${queue.length}`;

}

                    );

                })
                .catch(error => {

                    console.error(
                        '[Audio] background preparation failed',
                        error
                    );


                    showMessage(
                        `音声の準備に失敗しました: ${error.message}`
                    );

                });


        } catch (error) {

            console.error(
                '[Audio] initialization failed',
                error
            );


            showMessage(
                `音声システムの初期化に失敗しました: ${error.message}`
            );

        }

    }
);


/* ==========================================================
   ログアウト
========================================================== */

logoutBtn.addEventListener(
    'click',
    () => {

        stopQueue();


        document.getElementById(
            'mainSystem'
        ).classList.add(
            'hidden'
        );


        document.getElementById(
            'loginScreen'
        ).classList.remove(
            'hidden'
        );


        document.getElementById(
            'username'
        ).value = '';


        document.getElementById(
            'password'
        ).value = '';


        /*
         * AudioBufferは保持。
         *
         * 再ログイン時の再デコードを避ける。
         */

    }
);


/* ==========================================================
   再生ボタン
========================================================== */

playQueueBtn.addEventListener(
    'click',
    async () => {

        /*
         * このclickイベントがiPad/Safariにとって
         * 明確なユーザー操作になる。
         */

        await playQueueSequence();

    }
);


/* ==========================================================
   停止
========================================================== */

stopQueueBtn.addEventListener(
    'click',
    () => {

        stopQueue();

    }
);


/* ==========================================================
   iPad Safari 復帰対策
========================================================== */

document.addEventListener(
    'visibilitychange',
    async () => {

        if (
            document.visibilityState !== 'visible'
        ) {

            return;

        }


        console.log(
            '[Audio] page visible',
            {
                playing: isPlayingQueue,
                context:
                    audioContext?.state
            }
        );


        if (!audioContext) {
            return;
        }


        /*
         * バックグラウンド復帰時に
         * AudioContextがsuspendedになる場合がある。
         */

        if (
            audioContext.state !== 'running'
        ) {

            try {

                await audioContext.resume();


                console.log(
                    '[Audio] resumed after visibility change',
                    audioContext.state
                );


            } catch (error) {

                console.warn(
                    '[Audio] resume after visibility failed',
                    error
                );

            }

        }

    }
);


/* ==========================================================
   pageshow
========================================================== */

window.addEventListener(
    'pageshow',
    async () => {

        if (
            audioContext &&
            audioContext.state !== 'running'
        ) {

            try {

                await audioContext.resume();

            } catch (error) {

                console.warn(
                    '[Audio] pageshow resume failed',
                    error
                );

            }

        }

    }
);


/* ==========================================================
   初期化
========================================================== */

window.addEventListener(
    'load',
    () => {

        renderCategoryButtons();

        updateSequenceUI();

        setStatus(
            '準備完了',
            'indigo'
        );


        console.log(
            '===================================='
        );

        console.log(
            '音声連続再生システム 起動'
        );

        console.log(
            'Web Audio API版'
        );

        console.log(
            'iPad / Safari対応'
        );

        console.log(
            '===================================='

        );

    }
);

</script>
