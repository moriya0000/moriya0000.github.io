    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #020617;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: #f8fafc;
            background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.15), transparent 40%),
                        linear-gradient(135deg, #020617 0%, #0f172a 100%);
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        button, input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .safe-area {
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
        }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .hidden-force {
            display: none !important;
        }

        .loading-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .play-spin {
            animation: playSpin 1.2s linear infinite;
        }

        @keyframes playSpin {
            to { transform: rotate(360deg); }
        }

        .progress-transition {
            transition: width 0.1s linear;
        }

        .selection-ring {
            box-shadow: 0 0 0 2px #6366f1, 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* カスタムレンジスライダーUI */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }

            background: #1e293b;
            height: 6px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -5px;
            background-color: #818cf8;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.5);
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background-color: #a5b4fc;
        }
    </style>
</head>

<script>
"use strict";

/* ============================================================

============================================================ */
const AUTH_CONFIG = {

/* ============================================================

============================================================ */
const categories = {
    cause: [
        { id: "大雨", path: "audio/大雨.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "強風", path: "audio/強風.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "大雪", path: "audio/大雪.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "地震", path: "audio/地震.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "車両故障", path: "audio/車両故障.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "踏切事故", path: "audio/踏切事故.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "安全確認", path: "audio/安全確認.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "信号トラブル", path: "audio/信号トラブル.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "停電", path: "audio/停電.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "沿線火災", path: "audio/沿線火災.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "車両点検", path: "audio/車両点検.MP3", color: "from-indigo-600 to-indigo-700" },
        { id: "お客様救護", path: "audio/お客様救護.MP3", color: "from-indigo-600 to-indigo-700" }
    ],
    section: [
        { id: "取手", path: "audio/取手.MP3", color: "from-emerald-600 to-emerald-700" },
        { id: "守谷", path: "audio/守谷.MP3", color: "from-emerald-600 to-emerald-700" },
        { id: "水海道", path: "audio/水海道.MP3", color: "from-emerald-600 to-emerald-700" },
        { id: "下妻", path: "audio/下妻.MP3", color: "from-emerald-600 to-emerald-700" },
        { id: "下館", path: "audio/下館.MP3", color: "from-emerald-600 to-emerald-700" }
    ],
    status: [
        { id: "見合せています", path: "audio/見合せ.MP3", color: "from-amber-600 to-amber-700" },
        { id: "見合せ(振替有)", path: "audio/振替.MP3", color: "from-amber-600 to-amber-700" },
        { id: "遅延しています", path: "audio/遅延.MP3", color: "from-amber-600 to-amber-700" }
    ]
};

const fixedAudios = {
    "1": { id: "只今常総線は、", path: "audio/1.MP3" },
    "2": { id: "の影響で", path: "audio/2.MP3" },
    "3": { id: "から", path: "audio/3.MP3" },
    "4": { id: "の間で", path: "audio/4.MP3" }
};

/* ============================================================
   STATE MANAGEMENT
============================================================ */
let selectedCause = null;
let selectedSections = [];
let selectedStatus = null;

let audioContext = null;
let masterGain = null;
const audioBuffers = new Map();

let combinedPlaybackBuffer = null;
let combinedQueueKey = "";
let currentSource = null;
let currentSourceStartTime = 0;

let isPlayingQueue = false;
let playbackSessionId = 0;

let isLoopEnabled = false;
let loopIntervalSeconds = 10;
let loopTimerId = null;

let masterVolume = 1;
let audioEngineReady = false;
let audioEngineInitializing = false;

/* ============================================================
   DOM ELEMENTS
============================================================ */
const loginScreen = document.getElementById("loginScreen");
const mainSystem = document.getElementById("mainSystem");
const loginForm = document.getElementById("loginForm");
const loginError = document.getElementById("loginError");

const categoryCauseContainer = document.getElementById("category-cause");
const categorySectionContainer = document.getElementById("category-section");
const categoryStatusContainer = document.getElementById("category-status");

const sequenceDisplay = document.getElementById("sequenceDisplay");
const playQueueBtn = document.getElementById("playQueueBtn");
const playQueueIcon = document.getElementById("playQueueIcon");
const stopQueueBtn = document.getElementById("stopQueueBtn");
const resetSelectionBtn = document.getElementById("resetSelectionBtn");

const logoutButton = document.getElementById("logoutButton");
const statusBadge = document.getElementById("statusBadge");
const currentPlayingLabel = document.getElementById("currentPlayingLabel");
const queueProgressCount = document.getElementById("queueProgressCount");
const queueProgressBar = document.getElementById("queueProgressBar");

const masterVolumeInput = document.getElementById("masterVolume");
const masterVolumeVal = document.getElementById("masterVolumeVal");
const volumeIcon = document.getElementById("volumeIcon");
const messageBox = document.getElementById("messageBox");

const loopEnableToggle = document.getElementById("loopEnableToggle");
const loopSettingsArea = document.getElementById("loopSettingsArea");
const loopIntervalRange = document.getElementById("loopIntervalRange");
const loopIntervalInput = document.getElementById("loopIntervalInput");

const preparationIcon = document.getElementById("preparationIcon");
const preparationText = document.getElementById("preparationText");
const preparationCount = document.getElementById("preparationCount");
const preparationProgress = document.getElementById("preparationProgress");

/* ============================================================
   HELPERS & UI MESSAGES
============================================================ */
function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

let messageTimer = null;
function showMessage(text, type = "error") {
    clearTimeout(messageTimer);
    messageBox.className = "text-xs p-2.5 rounded-xl text-center border mt-2";

    if (type === "success") {
        messageBox.classList.add("bg-emerald-500/10", "border-emerald-500/20", "text-emerald-400");
    } else if (type === "warning") {
        messageBox.classList.add("bg-amber-500/10", "border-amber-500/20", "text-amber-400");
    } else {
        messageBox.classList.add("bg-rose-500/10", "border-rose-500/20", "text-rose-400");
    }

    messageBox.textContent = text;
    messageTimer = setTimeout(() => messageBox.classList.add("hidden"), 4000);
}

function setStatus(text, color = "indigo") {
    const colorMap = {
        indigo: ["bg-indigo-500/10", "text-indigo-400", "border-indigo-500/20", "bg-indigo-400"],
        emerald: ["bg-emerald-500/10", "text-emerald-400", "border-emerald-500/20", "bg-emerald-400"],
        amber: ["bg-amber-500/10", "text-amber-400", "border-amber-500/20", "bg-amber-400"],
        rose: ["bg-rose-500/10", "text-rose-400", "border-rose-500/20", "bg-rose-400"]
    };
    const c = colorMap[color] || colorMap.indigo;
    statusBadge.className = `px-2.5 py-1 rounded-full text-[11px] font-medium border flex items-center gap-1.5 ${c[0]} ${c[1]} ${c[2]}`;
    statusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${c[3]}"></span>${escapeHtml(text)}`;
}

function getAllAudioItems() {
    const result = [];
    Object.values(categories).forEach(group => group.forEach(item => result.push(item)));
    Object.values(fixedAudios).forEach(item => result.push(item));

    const unique = new Map();
    result.forEach(item => {
        if (!unique.has(item.path)) unique.set(item.path, item);
    });
    return Array.from(unique.values());
}

/* ============================================================
   WEB AUDIO ENGINE CORE
============================================================ */
async function ensureAudioContext() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error("Web Audio API非対応です。");

    if (!audioContext) {
        audioContext = new AudioContextClass();
        masterGain = audioContext.createGain();
        masterGain.gain.value = masterVolume;
        masterGain.connect(audioContext.destination);
    }

    if (audioContext.state !== "running") {
        try { await audioContext.resume(); } catch (e) {}
    }

    if (audioContext.state === "running") {
        try {
            const unlockSource = audioContext.createBufferSource();
            unlockSource.buffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
            unlockSource.connect(masterGain);
            unlockSource.start(0);
        } catch (e) {}
    }
    return audioContext;
}

async function loadAudioBuffer(item) {
    if (audioBuffers.has(item.path)) return audioBuffers.get(item.path);

    const response = await fetch(encodeURI(item.path), { method: "GET", cache: "force-cache" });
    if (!response.ok) throw new Error(`HTTP ${response.status}: ${item.path}`);

    const arrayBuffer = await response.arrayBuffer();
    if (!arrayBuffer || arrayBuffer.byteLength === 0) throw new Error(`空ファイル: ${item.path}`);

    const buffer = await audioContext.decodeAudioData(arrayBuffer);
    audioBuffers.set(item.path, buffer);
    return buffer;
}

async function preloadAllAudios() {
    if (audioEngineInitializing) return;
    audioEngineInitializing = true;
    audioEngineReady = false;

    try {
        await ensureAudioContext();
        const items = getAllAudioItems();
        let completed = 0;

        for (const item of items) {
            try { await loadAudioBuffer(item); } catch (e) {}
            completed++;
            preparationProgress.style.width = `${(completed / items.length) * 100}%`;
            preparationCount.textContent = `${completed} / ${items.length}`;
        }

        audioEngineReady = true;
        preparationIcon.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i>';
        preparationText.textContent = "音声準備完了";
        setStatus("準備完了", "indigo");
        updateSequenceUI();
    } catch (error) {
        audioEngineReady = false;
        preparationIcon.innerHTML = '<i class="fa-solid fa-xmark text-rose-400"></i>';
        preparationText.textContent = "音声の読み込みに失敗しました";
        setStatus("エラー", "rose");
    } finally {
        audioEngineInitializing = false;
    }
}

/* ============================================================
   UI & SELECTION CONTROLS
============================================================ */
function renderCategoryButtons() {
    renderGroup(categories.cause, categoryCauseContainer, "cause");
    renderGroup(categories.section, categorySectionContainer, "section");
    renderGroup(categories.status, categoryStatusContainer, "status");
}

function renderGroup(items, container, groupType) {
    container.innerHTML = "";
    items.forEach(item => {
        const button = document.createElement("button");
        const selected = isItemSelected(groupType, item);

        button.type = "button";
        button.className = selected
            ? `py-2 px-1 rounded-xl border text-center font-bold text-xs transition-all active:scale-95 bg-gradient-to-r ${item.color} border-white text-white shadow-md selection-ring`
            : `py-2 px-1 rounded-xl border text-center font-bold text-xs transition-all active:scale-95 bg-slate-800/80 border-slate-700/60 text-slate-300 hover:border-slate-500`;

        button.innerHTML = `<span class="truncate block">${escapeHtml(item.id)}</span>`;
        button.addEventListener("click", () => handleSelect(groupType, item));
        container.appendChild(button);
    });
}

function isItemSelected(groupType, item) {
    if (groupType === "cause") return selectedCause?.id === item.id;
    if (groupType === "section") return selectedSections.some(x => x.id === item.id);
    if (groupType === "status") return selectedStatus?.id === item.id;
    return false;
}

function handleSelect(groupType, item) {
    if (isPlayingQueue) {
        showMessage("再生中は選択を変更できません。", "warning");
        return;
    }

    if (groupType === "cause") {
        selectedCause = selectedCause?.id === item.id ? null : item;
    } else if (groupType === "section") {
        const index = selectedSections.findIndex(x => x.id === item.id);
        if (index >= 0) {
            selectedSections.splice(index, 1);
        } else {
            if (selectedSections.length >= 2) selectedSections.shift();
            selectedSections.push(item);
        }
    } else if (groupType === "status") {
        selectedStatus = selectedStatus?.id === item.id ? null : item;
    }

    combinedPlaybackBuffer = null;
    combinedQueueKey = "";
    renderCategoryButtons();
    updateSequenceUI();
}

function buildPlayQueue() {
    const queue = [fixedAudios["1"]];
    if (selectedCause) queue.push(selectedCause);
    queue.push(fixedAudios["2"]);
    if (selectedSections[0]) queue.push(selectedSections[0]);
    queue.push(fixedAudios["3"]);
    if (selectedSections[1]) queue.push(selectedSections[1]);
    queue.push(fixedAudios["4"]);
    if (selectedStatus) queue.push(selectedStatus);
    return queue;
}

function isSelectionComplete() {
    return selectedCause !== null && selectedSections.length === 2 && selectedStatus !== null;
}

async function buildCombinedPlaybackBuffer(queue) {
    const queueKey = queue.map(i => i.path).join("||");
    if (combinedPlaybackBuffer && combinedQueueKey === queueKey) return combinedPlaybackBuffer;

    const buffers = queue.map(i => audioBuffers.get(i.path)).filter(Boolean);
    if (buffers.length === 0) throw new Error("再生可能なデータがありません");

    let channels = 1, sampleRate = audioContext.sampleRate, duration = 0;
    buffers.forEach(b => {
        channels = Math.max(channels, b.numberOfChannels);
        duration += b.duration;
    });

    const combined = audioContext.createBuffer(channels, Math.ceil(duration * sampleRate) + 1, sampleRate);
    let offset = 0;

    buffers.forEach(b => {
        for (let c = 0; c < channels; c++) {
            const srcData = b.getChannelData(Math.min(c, b.numberOfChannels - 1));
            combined.getChannelData(c).set(srcData, offset);
        }
        offset += b.length;
    });

    combinedPlaybackBuffer = combined;
    combinedQueueKey = queueKey;
    return combined;
}

function updateSequenceUI() {
    sequenceDisplay.innerHTML = "";
    const queue = buildPlayQueue();

    queue.forEach((item, index) => {
        const fixed = Object.values(fixedAudios).includes(item);
        const pill = document.createElement("div");
        pill.className = fixed
            ? "px-2 py-1 rounded-lg text-[11px] font-medium border bg-slate-800/80 border-slate-700 text-slate-400"
            : "px-2.5 py-1 rounded-lg text-[11px] font-bold border bg-indigo-500/20 border-indigo-500/40 text-indigo-200";

        pill.innerHTML = `<span class="opacity-40 font-mono mr-1">${index + 1}.</span>${escapeHtml(item.id)}`;
        sequenceDisplay.appendChild(pill);
    });

    const ready = isSelectionComplete() && audioEngineReady;
    playQueueBtn.disabled = !ready || isPlayingQueue;

    if (!isPlayingQueue) {
        currentPlayingLabel.textContent = ready ? "再生準備完了" : (isSelectionComplete() ? "音声準備中..." : "条件を選択してください");
    }
    queueProgressCount.textContent = `0 / ${queue.length}`;
}

/* ============================================================
   PLAYBACK LOGIC
============================================================ */
function stopCurrentSource() {
    if (!currentSource) return;
    try {
        currentSource.onended = null;
        currentSource.stop(0);
        currentSource.disconnect();
    } catch (e) {}
    currentSource = null;
}

async function playQueueSequence() {
    if (!isSelectionComplete() || isPlayingQueue) return;

    try { await ensureAudioContext(); } catch (e) {
        showMessage("音声エンジンの起動に失敗しました。");
        return;
    }

    const queue = buildPlayQueue();
    let combinedBuffer;
    try {
        combinedBuffer = await buildCombinedPlaybackBuffer(queue);
    } catch (e) {
        showMessage("音声を合成できませんでした。");
        return;
    }

    stopCurrentSource();
    clearLoopTimer();

    playbackSessionId++;
    const session = playbackSessionId;
    isPlayingQueue = true;

    playQueueBtn.disabled = true;
    stopQueueBtn.disabled = false;
    playQueueIcon.className = "fa-solid fa-spinner play-spin text-lg";

    setStatus("再生中", "emerald");
    queueProgressCount.textContent = `${queue.length} 音声を再生中`;

    const source = audioContext.createBufferSource();
    source.buffer = combinedBuffer;
    source.connect(masterGain);
    currentSource = source;
    currentSourceStartTime = audioContext.currentTime;

    source.onended = () => {
        if (session === playbackSessionId) handlePlaybackFinished(session);
    };

    try {
        source.start(0);
    } catch (e) {
        stopQueue();
        showMessage("再生開始に失敗しました。");
        return;
    }

    updateCombinedProgress(session);
}

function updateCombinedProgress(session) {
    if (!isPlayingQueue || session !== playbackSessionId || !combinedPlaybackBuffer) return;

    const elapsed = audioContext.currentTime - currentSourceStartTime;
    const progress = Math.min(Math.max(elapsed / combinedPlaybackBuffer.duration, 0), 1);

    queueProgressBar.style.width = `${progress * 100}%`;
    currentPlayingLabel.textContent = `アナウンス再生中 (${Math.floor(progress * 100)}%)`;

    requestAnimationFrame(() => updateCombinedProgress(session));
}

function handlePlaybackFinished(session) {
    if (session !== playbackSessionId) return;

    isPlayingQueue = false;
    currentSource = null;
    queueProgressBar.style.width = "100%";

    const queue = buildPlayQueue();
    queueProgressCount.textContent = `${queue.length} / ${queue.length}`;
    playQueueIcon.className = "fa-solid fa-play text-lg";
    stopQueueBtn.disabled = true;

    if (isLoopEnabled) {
        setStatus("ループ待機", "amber");
        startLoopTimer();
    } else {
        setStatus("完了", "indigo");
        currentPlayingLabel.textContent = "再生完了";
        playQueueBtn.disabled = !(isSelectionComplete() && audioEngineReady);
    }
}

/* ============================================================
   LOOP CONTROLS
============================================================ */
function startLoopTimer() {
    clearLoopTimer();
    let remaining = Math.max(0, Number(loopIntervalSeconds) || 0);

    if (remaining <= 0) {
        restartPlayback();
        return;
    }

    currentPlayingLabel.textContent = `次回再生まで: ${remaining}秒`;
    loopTimerId = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
            clearLoopTimer();
            restartPlayback();
        } else {
            currentPlayingLabel.textContent = `次回再生まで: ${remaining}秒`;
        }
    }, 1000);
}

function clearLoopTimer() {
    if (loopTimerId) {
        clearInterval(loopTimerId);
        loopTimerId = null;
    }
}

async function restartPlayback() {
    if (!isSelectionComplete()) {
        stopQueue();
        return;
    }
    await playCombinedBufferDirect();
}

async function playCombinedBufferDirect() {
    const queue = buildPlayQueue();
    if (!combinedPlaybackBuffer) {
        try { combinedPlaybackBuffer = await buildCombinedPlaybackBuffer(queue); } catch (e) { return; }
    }

    stopCurrentSource();
    playbackSessionId++;
    const session = playbackSessionId;
    isPlayingQueue = true;

    const source = audioContext.createBufferSource();
    source.buffer = combinedPlaybackBuffer;
    source.connect(masterGain);
    currentSource = source;
    currentSourceStartTime = audioContext.currentTime;

    playQueueBtn.disabled = true;
    stopQueueBtn.disabled = false;
    playQueueIcon.className = "fa-solid fa-spinner play-spin text-lg";
    setStatus("再生中", "emerald");

    source.onended = () => {
        if (session === playbackSessionId) handlePlaybackFinished(session);
    };

    try { source.start(0); } catch (e) { isPlayingQueue = false; }
    updateCombinedProgress(session);
}

function stopQueue() {
    playbackSessionId++;
    isPlayingQueue = false;
    clearLoopTimer();
    stopCurrentSource();

    playQueueIcon.className = "fa-solid fa-play text-lg";
    stopQueueBtn.disabled = true;
    playQueueBtn.disabled = !(isSelectionComplete() && audioEngineReady);

    queueProgressBar.style.width = "0%";
    const queue = buildPlayQueue();
    queueProgressCount.textContent = `0 / ${queue.length}`;
    currentPlayingLabel.textContent = "停止中";
    setStatus("準備完了", "indigo");
}

/* ============================================================
   EVENT LISTENERS
============================================================ */
playQueueBtn.addEventListener("click", playQueueSequence);
stopQueueBtn.addEventListener("click", stopQueue);

resetSelectionBtn.addEventListener("click", () => {
    if (isPlayingQueue) stopQueue();
    selectedCause = null;
    selectedSections = [];
    selectedStatus = null;
    combinedPlaybackBuffer = null;
    combinedQueueKey = "";
    renderCategoryButtons();
    updateSequenceUI();
});

masterVolumeInput.addEventListener("input", (e) => {
    masterVolume = Number(e.target.value);
    if (masterGain && audioContext) masterGain.gain.value = masterVolume;
    masterVolumeVal.textContent = `${Math.round(masterVolume * 100)}%`;

    if (masterVolume <= 0) volumeIcon.className = "fa-solid fa-volume-xmark text-slate-400 text-xs w-4 text-center";
    else if (masterVolume < 0.5) volumeIcon.className = "fa-solid fa-volume-low text-slate-400 text-xs w-4 text-center";
    else volumeIcon.className = "fa-solid fa-volume-high text-slate-400 text-xs w-4 text-center";
});

loopEnableToggle.addEventListener("change", (e) => {
    isLoopEnabled = e.target.checked;
    if (isLoopEnabled) {
        loopSettingsArea.classList.remove("opacity-30", "pointer-events-none");
    } else {
        loopSettingsArea.classList.add("opacity-30", "pointer-events-none");
        clearLoopTimer();
    }
});

loopIntervalRange.addEventListener("input", (e) => {
    const val = Math.max(0, Math.min(300, Number(e.target.value) || 10));
    loopIntervalSeconds = val;
    loopIntervalInput.value = val;
});

loopIntervalInput.addEventListener("change", (e) => {
    const val = Math.max(0, Math.min(300, Number(e.target.value) || 10));
    loopIntervalSeconds = val;
    loopIntervalInput.value = val;
    loopIntervalRange.value = val;
});

loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (username !== AUTH_CONFIG.username || password !== AUTH_CONFIG.password) {
        loginError.classList.remove("hidden");
        return;
    }

    loginError.classList.add("hidden");
    try { await ensureAudioContext(); } catch (e) {}

    loginScreen.classList.add("hidden");
    mainSystem.classList.remove("hidden-force");
    setStatus("準備中", "indigo");

    setTimeout(() => preloadAllAudios(), 50);
});

logoutButton.addEventListener("click", () => {
    stopQueue();
    mainSystem.classList.add("hidden-force");
    loginScreen.classList.remove("hidden");
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
});

document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState === "visible" && audioContext && audioContext.state !== "running") {
        try { await audioContext.resume(); } catch (e) {}
    }
});

window.addEventListener("load", () => {
    renderCategoryButtons();
    updateSequenceUI();
    setStatus("未ログイン", "indigo");
});
</script>
