// ============================================================
// AudioContext初期化
// ============================================================

async function initAudioContext() {

    if (!audioContext) {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContextClass) {

            throw new Error(
                'このブラウザはWeb Audio APIに対応していません。'
            );
        }


        audioContext =
            new AudioContextClass();


        masterGainNode =
            audioContext.createGain();


        masterGainNode.gain.value =
            masterVolume;


        masterGainNode.connect(
            audioContext.destination
        );

    }


    /*
     * iPad Safari対策
     *
     * 再生ボタンのユーザー操作から
     * AudioContextをrunning状態へ戻す。
     */

    if (
        audioContext.state !== 'running'
    ) {

        await audioContext.resume();

    }


    console.log(
        'AudioContext state:',
        audioContext.state
    );


    if (
        audioContext.state !== 'running'
    ) {

        throw new Error(
            `AudioContextを起動できませんでした。現在の状態: ${audioContext.state}`
        );

    }

}



// ============================================================
// 個別音声をデコード
// ============================================================

async function loadAudioBuffer(path) {

    if (
        audioBufferCache.has(path)
    ) {

        return audioBufferCache.get(path);

    }


    console.log(
        '音声読み込み:',
        path
    );


    /*
     * 日本語ファイル名でもfetch可能。
     * encodeURIを使用してURLとして安全にする。
     */

    const encodedPath =
        encodeURI(path);


    const response =
        await fetch(
            encodedPath,
            {
                cache: 'force-cache'
            }
        );


    if (!response.ok) {

        throw new Error(
            `${path} の読み込みに失敗しました HTTP ${response.status}`
        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    if (
        arrayBuffer.byteLength === 0
    ) {

        throw new Error(
            `${path} が空のファイルです`
        );

    }


    let audioBuffer;


    try {

        audioBuffer =
            await audioContext.decodeAudioData(
                arrayBuffer
            );

    } catch (error) {

        console.error(
            'decodeAudioData error:',
            path,
            error
        );

        throw new Error(
            `${path} の音声デコードに失敗しました`
        );

    }


    audioBufferCache.set(
        path,
        audioBuffer
    );


    console.log(
        'デコード完了:',
        path,
        `${audioBuffer.duration.toFixed(2)}秒`
    );


    return audioBuffer;

}

function buildPlayQueue() {

    const queue = [];


    queue.push(
        fixedAudios['1']

    if (selectedCause) {

        queue.push(
            selectedCause
        );

    }


    queue.push(
        fixedAudios['2']
    );


    if (selectedSections[0]) {

        queue.push(
            selectedSections[0]
        );

    }


    queue.push(
        fixedAudios['3']
    );


    if (selectedSections[1]) {

        queue.push(
            selectedSections[1]
        );

    }


    queue.push(
        fixedAudios['4']
    );


    if (selectedStatus) {

        queue.push(
            selectedStatus
        );

    }


    return queue;

}

async function prepareCombinedAudio() {

    await initAudioContext();


    const queue =

        !isSelectionComplete()

    const buffers = [];


    for (
        let i = 0;
        i < queue.length;
        i++
    ) {

        const item =
            queue[i];


        currentPlayingLabel.textContent =
            `音声を準備中 (${i + 1}/${queue.length}): ${item.id}`;


        queueProgressCount.textContent =
            `${i + 1} / ${queue.length}`;


        const buffer =
            await loadAudioBuffer(
                item.path
            );


        buffers.push(
            buffer
        );

    }


    /*
     * AudioContextのサンプルレートに合わせる。
     *
     * decodeAudioData()によってAudioBufferは
     * AudioContextのsampleRateへ変換される。
     */

    const sampleRate =
        audioContext.sampleRate;


    /*
     * 最大チャンネル数を取得
     */

    let numberOfChannels = 1;


    buffers.forEach(buffer => {

        numberOfChannels =
            Math.max(
                numberOfChannels,
                buffer.numberOfChannels
            );

    });


    /*
     * 全音声の総サンプル数
     */

    let totalLength = 0;


    buffers.forEach(buffer => {

        totalLength +=
            buffer.length;

    });


    /*
     * 連結用AudioBufferを作成
     */

    const combinedBuffer =
        audioContext.createBuffer(
            numberOfChannels,
            totalLength,
            sampleRate
        );


    /*
     * 各音声を順番にコピー
     */

    let writeOffset = 0;

    combinedSegments = [];


    for (
        let i = 0;
        i < buffers.length;
        i++
    ) {

        const buffer =
            buffers[i];


        const startTime =
            writeOffset / sampleRate;


        /*
         * セグメント情報を保存
         *
         * 進捗表示に使用する。
         */

        combinedSegments.push({

            index: i,

            id: queue[i].id,

            startTime: startTime,

            duration: buffer.duration,

            endTime:
                startTime +
                buffer.duration

        });


        /*
         * チャンネルごとにコピー
         */

        for (
            let channel = 0;
            channel < numberOfChannels;
            channel++
        ) {

            const destination =
                combinedBuffer.getChannelData(
                    channel
                );


            /*
             * 元音声にそのチャンネルが存在しない場合、
             * 無音として扱う。
             */

            if (
                channel <
                buffer.numberOfChannels
            ) {

                const source =
                    buffer.getChannelData(
                        channel
                    );


                destination.set(
                    source,
                    writeOffset
                );

            }

        }


        writeOffset +=
            buffer.length;

    }


    combinedAudioBuffer =
        combinedBuffer;


    console.log(
        '連結音声準備完了:',
        combinedBuffer.duration,
        '秒'
    );


    currentPlayingLabel.textContent =
        '再生準備完了';


    queueProgressCount.textContent =
        `${queue.length} / ${queue.length}`;


    queueProgressBar.style.width =
        '0%';


    return combinedBuffer;

}



// ============================================================
// 選択完了判定
// ============================================================

function isSelectionComplete() {

    return (

        selectedCause !== null &&

        selectedSections.length === 2 &&

        selectedStatus !== null

    );

}



// ============================================================
// カテゴリ表示
// ============================================================

function renderCategoryButtons() {

    renderGroup(
        categories.cause,
        categoryCauseContainer,
        'cause'
    );


    renderGroup(
        categories.section,
        categorySectionContainer,
        'section'
    );


    renderGroup(
        categories.status,
        categoryStatusContainer,
        'status'
    );

}



function renderGroup(
    items,
    container,
    groupType
) {

    container.innerHTML = '';


    items.forEach(item => {

        const btn =
            document.createElement('button');


        const isSelected =
            isItemSelected(
                groupType,
                item
            );


        btn.className =
            `p-2.5 rounded-xl border text-center font-bold
             transition-all transform active:scale-95 ${
                isSelected
                    ? `bg-gradient-to-tr ${item.color}
                       border-white text-white shadow-lg
                       ring-2 ring-indigo-400`
                    : `bg-slate-800/80 border-slate-700/60
                       text-slate-300 hover:bg-slate-700/80`
            }`;


        btn.innerHTML = `

            <div class="text-xs sm:text-sm font-black truncate">

                ${item.id}

            </div>

        `;


        btn.addEventListener(
            'click',
            () => {

                handleSelect(
                    groupType,
                    item
                );

            }
        );


        container.appendChild(btn);

    });

}



function isItemSelected(
    groupType,
    item
) {

    if (
        groupType === 'cause'
    ) {

        return (
            selectedCause?.id === item.id
        );

    }


    if (
        groupType === 'section'
    ) {

        return selectedSections.some(
            s => s.id === item.id
        );

    }


    if (
        groupType === 'status'
    ) {

        return (
            selectedStatus?.id === item.id
        );

    }


    return false;

}



// ============================================================
// 選択処理
// ============================================================

function handleSelect(
    groupType,
    item
) {

    if (isPlayingQueue) {

        showMessage(
            '再生中は選択を変更できません。'
        );

        return;

    }


    /*
     * 条件を変更したら、
     * 以前作った連結AudioBufferを破棄する。
     */

    combinedAudioBuffer = null;


    if (
        groupType === 'cause'
    ) {

        selectedCause =
            selectedCause?.id === item.id
                ? null
                : item;

    }


    else if (
        groupType === 'section'
    ) {

        const existsIndex =
            selectedSections.findIndex(
                s => s.id === item.id
            );


        if (
            existsIndex > -1
        ) {

            selectedSections.splice(
                existsIndex,
                1
            );

        } else {

            if (
                selectedSections.length >= 2
            ) {

                selectedSections.shift();

            }


            selectedSections.push(
                item
            );

        }

    }


    else if (
        groupType === 'status'
    ) {

        selectedStatus =
            selectedStatus?.id === item.id
                ? null
                : item;

    }


    renderCategoryButtons();

    updateSequenceUI();

}



// ============================================================
// シーケンス表示
// ============================================================

function updateSequenceUI() {

    sequenceDisplay.innerHTML = '';


    const queue =
        buildPlayQueue();


    queue.forEach(
        (item, index) => {

            const isFixed =

                item === fixedAudios['1'] ||
                item === fixedAudios['2'] ||
                item === fixedAudios['3'] ||
                item === fixedAudios['4'];


            const pill =
                document.createElement('div');


            pill.className =
                `flex items-center gap-1.5 px-3 py-1.5
                 rounded-xl text-xs font-semibold shadow-sm border ${
                    isFixed
                        ? 'bg-slate-800/90 border-slate-600 text-slate-300'
                        : 'bg-indigo-600/30 border-indigo-500/50 text-indigo-200'
                 }`;


            pill.innerHTML = `

                <span class="text-[10px] text-slate-400 font-mono">

                    ${index + 1}.

                </span>

                <span>

                    ${item.id}

                </span>

            `;


            sequenceDisplay.appendChild(
                pill
            );

        }
    );


    const ready =
        isSelectionComplete();


    if (ready) {

        if (!isPlayingQueue) {

            playQueueBtn.removeAttribute(
                'disabled'
            );

        }


        currentPlayingLabel.textContent =
            '再生準備完了';

    } else {

        playQueueBtn.setAttribute(
            'disabled',
            'true'
        );


        currentPlayingLabel.textContent =
            '原因(1つ)、区間(2つ)、状況(1つ)を選択してください';

    }


    queueProgressCount.textContent =
        `0 / ${queue.length}`;

}



// ============================================================
// リセット
// ============================================================

resetSelectionBtn.addEventListener(
    'click',
    () => {

        if (isPlayingQueue) {

            stopQueue();

        }


        combinedAudioBuffer = null;

        combinedSegments = [];

        selectedCause = null;

        selectedSections = [];

        selectedStatus = null;


        renderCategoryButtons();

        updateSequenceUI();

    }
);



// ============================================================
// 連結AudioBuffer再生
// ============================================================

function startCombinedPlayback() {

    return new Promise(
        (resolve, reject) => {

            if (
                !audioContext ||
                !masterGainNode ||
                !combinedAudioBuffer
            ) {

                reject(
                    new Error(
                        '再生用AudioBufferが準備されていません'
                    )
                );

                return;

            }


            /*
             * AudioBufferSourceNodeは一度しかstartできない。
             *
             * そのため再生するたびに新しいNodeを作る。
             */

            const source =
                audioContext.createBufferSource();


            source.buffer =
                combinedAudioBuffer;


            source.connect(
                masterGainNode
            );


            currentSourceNode =
                source;


            playbackStartedAt =
                audioContext.currentTime;


            playbackOffset = 0;


            source.onended = () => {

                if (
                    currentSourceNode === source
                ) {

                    currentSourceNode = null;

                }


                resolve();

            };


            try {

                /*
                 * 0秒から再生。
                 */

                source.start(0);

            } catch (error) {

                currentSourceNode = null;

                reject(error);

            }

        }
    );

}



// ============================================================
// 再生開始
// ============================================================

async function playQueueSequence() {

    if (
        !isSelectionComplete()
    ) {

        return;

    }


    /*
     * 新しい再生セッション。
     */

    playbackSessionId++;


    const session =
        playbackSessionId;


    clearLoopTimers();


    isPlayingQueue = true;


    playQueueBtn.setAttribute(
        'disabled',
        'true'
    );


    stopQueueBtn.removeAttribute(
        'disabled'
    );


    playQueueIcon.className =
        'fa-solid fa-rotate animate-spin text-xl';


    setPlayingStatus();


    try {

        /*
         * 念のため再生直前にもAudioContextを確認。
         */

        await initAudioContext();


        /*
         * 条件変更後などでAudioBufferがない場合、
         * ここで作成。
         */

        if (
            !combinedAudioBuffer
        ) {

            await prepareCombinedAudio();

        }


        /*
         * Stopされた場合はここで終了。
         */

        if (
            !isPlayingQueue ||
            session !== playbackSessionId
        ) {

            return;

        }


        currentPlayingLabel.textContent =
            '再生中';


        queueProgressBar.style.width =
            '0%';


        queueProgressCount.textContent =
            `1 / ${buildPlayQueue().length}`;


        /*
         * 1本に連結された音声を再生。
         */

        await startCombinedPlayback();


        /*
         * Stopされた場合。
         */

        if (
            !isPlayingQueue ||
            session !== playbackSessionId
        ) {

            return;

        }


        /*
         * 1周終了
         */

        if (isLoopEnabled) {

            startLoopWait();

        } else {

            finishQueue();

        }

    } catch (error) {

        console.error(
            '再生エラー:',
            error
        );


        if (
            session !== playbackSessionId
        ) {

            return;

        }


        showMessage(
            `音声の再生に失敗しました: ${error.message}`
        );


        finishQueue();

    }

}



// ============================================================
// 再生中ステータス
// ============================================================

function setPlayingStatus() {

    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-emerald-500/10 text-emerald-400 ' +
        'border border-emerald-500/20 ' +
        'flex items-center gap-1.5';


    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>再生中';

}



// ============================================================
// 進捗表示
// ============================================================

function updatePlaybackProgress() {

    if (
        !isPlayingQueue ||
        !audioContext ||
        !combinedAudioBuffer
    ) {

        return;

    }


    if (
        !currentSourceNode
    ) {

        return;

    }


    const elapsed =
        audioContext.currentTime -
        playbackStartedAt;


    const duration =
        combinedAudioBuffer.duration;


    const progress =
        Math.min(
            1,
            Math.max(
                0,
                elapsed / duration
            )
        );


    queueProgressBar.style.width =
        `${progress * 100}%`;


    /*
     * 現在どの音声を再生しているかを判定。
     */

    let currentSegmentIndex = 0;


    for (
        let i = 0;
        i < combinedSegments.length;
        i++
    ) {

        const segment =
            combinedSegments[i];


        if (
            elapsed >= segment.startTime &&
            elapsed < segment.endTime
        ) {

            currentSegmentIndex =
                i;

            break;

        }

    }


    const segment =
        combinedSegments[
            currentSegmentIndex
        ];


    if (segment) {

        const queue =
            buildPlayQueue();


        currentPlayingLabel.textContent =
            `再生中 (${currentSegmentIndex + 1}/${queue.length}): ${segment.id}`;


        queueProgressCount.textContent =
            `${currentSegmentIndex + 1} / ${queue.length}`;

    }


    if (
        isPlayingQueue
    ) {

        requestAnimationFrame(
            updatePlaybackProgress
        );

    }

}



// ============================================================
// 再生完了
// ============================================================

function finishQueue() {

    isPlayingQueue = false;


    clearLoopTimers();


    if (
        currentSourceNode
    ) {

        try {

            currentSourceNode.onended =
                null;

            currentSourceNode.stop();

        } catch (e) {

        }


        try {

            currentSourceNode.disconnect();

        } catch (e) {

        }


        currentSourceNode =
            null;

    }


    playQueueIcon.className =
        'fa-solid fa-play text-xl ml-0.5';


    stopQueueBtn.setAttribute(
        'disabled',
        'true'
    );


    if (
        isSelectionComplete()
    ) {

        playQueueBtn.removeAttribute(
            'disabled'
        );

    }


    currentPlayingLabel.textContent =
        '再生完了！';


    queueProgressBar.style.width =
        '100%';


    const queue =
        buildPlayQueue();


    queueProgressCount.textContent =
        `${queue.length} / ${queue.length}`;


    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-indigo-500/10 text-indigo-400 ' +
        'border border-indigo-500/20 ' +
        'flex items-center gap-1.5';


    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full bg-indigo-400"></span>完了';

}



// ============================================================
// ループ待機
// ============================================================

function startLoopWait() {

    if (
        !isPlayingQueue
    ) {

        return;

    }


    remainingCountdown =
        loopIntervalSeconds;


    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-amber-500/10 text-amber-400 ' +
        'border border-amber-500/20 ' +
        'flex items-center gap-1.5';


    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>ループ待機中';


    if (
        remainingCountdown <= 0
    ) {

        restartQueue();

        return;

    }


    updateCountdownLabel();


    clearLoopTimers();


    countdownTimerId =
        setInterval(
            () => {

                if (
                    !isPlayingQueue
                ) {

                    clearLoopTimers();

                    return;

                }


                remainingCountdown--;


                if (
                    remainingCountdown <= 0
                ) {

                    clearInterval(
                        countdownTimerId
                    );


                    countdownTimerId =
                        null;


                    restartQueue();

                } else {

                    updateCountdownLabel();

                }

            },
            1000
        );

}



// ============================================================
// ループ再開
// ============================================================

async function restartQueue() {

    if (
        !isPlayingQueue
    ) {

        return;

    }


    clearLoopTimers();


    try {

        await initAudioContext();

    } catch (error) {

        showMessage(
            `AudioContextの再開に失敗しました: ${error.message}`
        );

        stopQueue();

        return;

    }


    queueProgressBar.style.width =
        '0%';


    setPlayingStatus();


    const session =
        playbackSessionId;


    try {

        await startCombinedPlayback();


        if (
            !isPlayingQueue ||
            session !== playbackSessionId
        ) {

            return;

        }


        if (
            isLoopEnabled
        ) {

            startLoopWait();

        } else {

            finishQueue();

        }

    } catch (error) {

        console.error(
            'ループ再生エラー:',
            error
        );


        finishQueue();

    }

}



// ============================================================
// カウントダウン
// ============================================================

function updateCountdownLabel() {

    currentPlayingLabel.textContent =
        `ループ再生待機中 (${remainingCountdown}秒後に再再生)...`;

}



// ============================================================
// タイマー解除
// ============================================================

function clearLoopTimers() {

    if (
        countdownTimerId
    ) {

        clearInterval(
            countdownTimerId
        );

        countdownTimerId =
            null;

    }

}



// ============================================================
// 停止
// ============================================================

function stopQueue() {

    /*
     * 古い再生セッションを無効化
     */

    playbackSessionId++;


    isPlayingQueue = false;


    clearLoopTimers();


    /*
     * AudioBufferSourceNode停止
     */

    if (
        currentSourceNode
    ) {

        try {

            currentSourceNode.onended =
                null;

            currentSourceNode.stop();

        } catch (e) {

        }


        try {

            currentSourceNode.disconnect();

        } catch (e) {

        }


        currentSourceNode =
            null;

    }


    playbackOffset = 0;


    playQueueIcon.className =
        'fa-solid fa-play text-xl ml-0.5';


    stopQueueBtn.setAttribute(
        'disabled',
        'true'
    );


    if (
        isSelectionComplete()
    ) {

        playQueueBtn.removeAttribute(
            'disabled'
        );

    }


    currentPlayingLabel.textContent =
        '再生停止';


    queueProgressBar.style.width =
        '0%';


    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-indigo-500/10 text-indigo-400 ' +
        'border border-indigo-500/20 ' +
        'flex items-center gap-1.5';


    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full bg-indigo-400"></span>準備完了';

}



// ============================================================
// 再生ボタン
// ============================================================

playQueueBtn.addEventListener(
    'click',
    async () => {

        if (
            isPlayingQueue
        ) {

            return;

        }


        if (
            !isSelectionComplete()
        ) {

            showMessage(
                '原因・区間2つ・状況をすべて選択してください。'
            );

            return;

        }


        /*
         * iPad Safariでは、このclickイベントから
         * AudioContextをresumeすることが重要。
         *
         * その後に音声をロードする。
         */

        try {

            await initAudioContext();


            /*
             * 音声をまだ連結していない場合は作成。
             */

            if (
                !combinedAudioBuffer
            ) {

                await prepareCombinedAudio();

            }


            /*
             * ユーザーが準備中に停止した場合。
             */

            if (
                isPlayingQueue
            ) {

                return;

            }


            /*
             * 再生開始
             */

            await playQueueSequence();

        } catch (error) {

            console.error(
                '音声準備エラー:',
                error
            );


            showMessage(
                `音声の準備に失敗しました: ${error.message}`
            );


            isPlayingQueue =
                false;


            playQueueIcon.className =
                'fa-solid fa-play text-xl ml-0.5';


            stopQueueBtn.setAttribute(
                'disabled',
                'true'
            );


            if (
                isSelectionComplete()
            ) {

                playQueueBtn.removeAttribute(
                    'disabled'
                );

            }

        }

    }
);



// ============================================================
// 停止ボタン
// ============================================================

stopQueueBtn.addEventListener(
    'click',
    stopQueue
);



// ============================================================
// 音量
// ============================================================

masterVolumeInput.addEventListener(
    'input',
    (e) => {

        masterVolume =
            parseFloat(
                e.target.value
            );


        masterVolumeVal.textContent =
            `${Math.round(masterVolume * 100)}%`;


        if (
            masterGainNode
        ) {

            masterGainNode.gain.value =
                masterVolume;

        }

    }
);



// ============================================================
// ループON/OFF
// ============================================================

loopEnableToggle.addEventListener(
    'change',
    (e) => {

        isLoopEnabled =
            e.target.checked;


        if (
            isLoopEnabled
        ) {

            loopSettingsArea.classList.remove(
                'opacity-50',
                'pointer-events-none'
            );

        } else {

            loopSettingsArea.classList.add(
                'opacity-50',
                'pointer-events-none'
            );


            clearLoopTimers();

        }

    }
);



// ============================================================
// ループ秒数
// ============================================================

loopIntervalRange.addEventListener(
    'input',
    (e) => {

        loopIntervalSeconds =
            parseInt(
                e.target.value,
                10
            ) || 0;


        loopIntervalInput.value =
            loopIntervalSeconds;

    }
);



loopIntervalInput.addEventListener(
    'change',
    (e) => {

        let value =
            parseInt(
                e.target.value,
                10
            ) || 0;


        if (
            value < 0
        ) {

            value = 0;

        }


        if (
            value > 300
        ) {

            value = 300;

        }


        loopIntervalSeconds =
            value;


        loopIntervalInput.value =
            value;


        loopIntervalRange.value =
            value;

    }
);



// ============================================================
// ページ復帰
// ============================================================

document.addEventListener(
    'visibilitychange',
    async () => {

        if (
            document.visibilityState !== 'visible'
        ) {

            return;

        }


        if (
            !isPlayingQueue
        ) {

            return;

        }


        /*
         * iPadでSafariへ戻ってきたとき、
         * AudioContextがsuspendedになる場合に備える。
         */

        try {

            if (
                audioContext &&
                audioContext.state !== 'running'
            ) {

                await audioContext.resume();

                console.log(
                    'ページ復帰後AudioContext:',
                    audioContext.state
                );

            }

        } catch (error) {

            console.warn(
                'ページ復帰後のAudioContext再開失敗:',
                error
            );

        }

    }
);



// ============================================================
// 初期化
// ============================================================

window.addEventListener(
    'load',
    () => {

        renderCategoryButtons();

        updateSequenceUI();

        console.log(
            '音声連続再生システム 初期化完了'
        );

    }
);



// ============================================================
// 進捗更新ループ
// ============================================================

function startProgressLoop() {

    if (
        !isPlayingQueue
    ) {

        return;

    }


    updatePlaybackProgress();

}


setInterval(
    () => {

        if (
            isPlayingQueue &&
            currentSourceNode &&
            combinedAudioBuffer
        ) {

            updatePlaybackProgress();

        }

    },
    100
);


</script>
