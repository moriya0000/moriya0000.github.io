<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声連続再生システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type="range"] { accent-color: #6366f1; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- ログイン画面 -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/60 rounded-3xl shadow-2xl p-6 md:p-8">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-600/20 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-indigo-500/30">
                    <i class="fa-solid fa-lock text-indigo-400 text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-white">ログイン</h2>
                <p class="text-xs text-slate-400 mt-1">音声連続再生システムを利用するにはログインしてください</p>
            </div>

            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">ユーザー名</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="username" placeholder="" required

                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">パスワード</label>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="password" id="password" placeholder="" required
                            class="w-full bg-slate-900/60 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                </div>

                <div id="loginError" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-lg p-2.5 text-center">
                    ユーザー名またはパスワードが違います
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-right-to-bracket"></i> ログイン
                </button>
            </form>
        </div>
    </div>

    <!-- メイン操作画面（初期状態は hidden） -->
    <div id="mainSystem" class="hidden w-full max-w-2xl bg-slate-800/90 backdrop-blur-xl border border-slate-700/60 rounded-3xl shadow-2xl p-6 md:p-8">
        
        <!-- ヘッダー -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700/60">
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    <i class="fa-solid fa-music text-indigo-400"></i> 音声連続再生システム
                </h1>
                <p class="text-xs text-slate-400 mt-1">カテゴリごとに音声を選択して連続再生します</p>
            </div>
            <div class="flex items-center gap-3">
                <div id="statusBadge" class="px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                    準備完了
                </div>
                <button onclick="handleLogout()" class="px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs text-slate-300 hover:text-white transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i> ログアウト
                </button>
            </div>
        </div>

        <!-- 音声選択カテゴリ -->
        <div class="space-y-6 mb-6">
            <!-- 1. 原因 -->
            <div class="bg-slate-900/40 p-4 rounded-2xl border border-slate-700/40">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i> １．原因（1つ選択）
                </h2>
                <div id="category-cause" class="grid grid-cols-3 sm:grid-cols-4 gap-2.5"></div>
            </div>

            <!-- 2. 区間 -->
            <div class="bg-slate-900/40 p-4 rounded-2xl border border-slate-700/40">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-route"></i> ２．区間（2つ選択）
                </h2>
                <div id="category-section" class="grid grid-cols-3 sm:grid-cols-5 gap-2.5"></div>
            </div>

            <!-- 3. 状況 -->
            <div class="bg-slate-900/40 p-4 rounded-2xl border border-slate-700/40">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-amber-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-circle-info"></i> ３．状況（1つ選択）
                </h2>
                <div id="category-status" class="grid grid-cols-3 gap-2.5"></div>
            </div>
        </div>

        <!-- 再生予定シーケンス確認 -->
        <div class="bg-slate-900/70 rounded-2xl p-4 mb-6 border border-slate-700/40">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-list-ol text-indigo-400"></i> 再生順序
                </h3>
                <button id="resetSelectionBtn" class="text-xs text-rose-400 hover:text-rose-300 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-rotate-left"></i> 選択解除
                </button>
            </div>
            
            <div id="sequenceDisplay" class="flex flex-wrap items-center gap-2 min-h-[50px] p-2 bg-slate-800/60 rounded-xl border border-slate-700/30">
                <!-- JavaScriptで再生順序を動的表示 -->
            </div>
        </div>

        <!-- ループ設定パネル -->
        <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-700/40 mb-6">
            <div class="flex items-center justify-between mb-3">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="loopEnableToggle" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600 relative"></div>
                    <span class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                        <i class="fa-solid fa-repeat text-indigo-400"></i> 定期ループ再生を有効にする
                    </span>
                </label>
            </div>
            
            <div id="loopSettingsArea" class="flex flex-col sm:flex-row items-center gap-4 opacity-50 pointer-events-none transition-all duration-200">
                <div class="flex-1 w-full flex items-center gap-3">
                    <span class="text-xs text-slate-400 shrink-0">再生間隔:</span>
                    <input type="range" id="loopIntervalRange" min="0" max="300" step="5" value="10" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    <div class="flex items-center gap-1 shrink-0">
                        <input type="number" id="loopIntervalInput" min="0" max="300" value="10" class="w-16 bg-slate-800 border border-slate-700 text-xs rounded-lg px-2 py-1 text-center font-bold text-indigo-300 focus:outline-none focus:border-indigo-500">
                        <span class="text-xs text-slate-400">秒</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- プレイヤーコントロール -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-700/40 mb-4">
            <div class="flex items-center gap-3 w-full sm:w-auto justify-center">
                <button id="playQueueBtn" class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white flex items-center justify-center shadow-lg shadow-emerald-500/30 transition-all disabled:opacity-40 disabled:cursor-not-allowed hover:scale-105 active:scale-95" disabled title="再生開始">
                    <i id="playQueueIcon" class="fa-solid fa-play text-xl ml-0.5"></i>
                </button>
                <button id="stopQueueBtn" class="w-12 h-12 rounded-2xl bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center justify-center transition-all disabled:opacity-40 disabled:cursor-not-allowed" disabled title="停止">
                    <i class="fa-solid fa-stop text-base"></i>
                </button>
            </div>

            <!-- 進捗バー / ステータス表示 -->
            <div class="flex-1 w-full px-2">
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span id="currentPlayingLabel" class="font-medium text-white truncate max-w-[220px]">条件を選択してください</span>
                    <span id="queueProgressCount">0 / 0</span>
                </div>
                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700/50">
                    <div id="queueProgressBar" class="bg-indigo-500 h-full w-0 transition-all duration-150"></div>
                </div>
            </div>
        </div>

        <!-- 音量調整 -->
        <div class="flex items-center gap-4 bg-slate-900/40 px-4 py-3 rounded-xl border border-slate-700/30">
            <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
            <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="1" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            <span id="masterVolumeVal" class="text-xs text-slate-400 w-8 text-right">100%</span>
        </div>

        <!-- エラーメッセージ用 -->
        <div id="messageBox" class="hidden mt-4 p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-400 text-xs text-center"></div>
    </div>

    <script>
        // 認証用設定 (本番環境ではサーバー側の認証ロジックを推奨します)
        const AUTH_CONFIG = {
            username: "moriya",
            password: "480031"
        };

        function handleLogin(event) {
            event.preventDefault();
            const uInput = document.getElementById('username').value;
            const pInput = document.getElementById('password').value;
            const loginError = document.getElementById('loginError');

            if (uInput === AUTH_CONFIG.username && pInput === AUTH_CONFIG.password) {
                loginError.classList.add('hidden');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainSystem').classList.remove('hidden');
            } else {
                loginError.classList.remove('hidden');
            }
        }

        function handleLogout() {
            if (isPlayingQueue) {
                stopQueue();
            }
            document.getElementById('mainSystem').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // 音声データ構造
        const categories = {
            cause: [
                { id: '大雨', name: '', path: 'audio/大雨.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '強風', name: '', path: 'audio/強風.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '大雪', name: '', path: 'audio/大雪.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '地震', name: '', path: 'audio/地震.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '車両故障', name: '', path: 'audio/車両故障.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '踏切事故', name: '', path: 'audio/踏切事故.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '安全確認', name: '', path: 'audio/安全確認.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '信号トラブル', name: '', path: 'audio/信号トラブル.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '停電', name: '', path: 'audio/停電.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '沿線火災', name: '', path: 'audio/沿線火災.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: '車両点検', name: '', path: 'audio/車両点検.MP3', color: 'from-indigo-600 to-violet-600' },
                { id: 'お客様救護', name: '', path: 'audio/お客様救護.MP3', color: 'from-indigo-600 to-violet-600' }
            ],
            section: [
                { id: '取手', name: '', path: 'audio/取手.MP3', color: 'from-emerald-600 to-teal-600' },
                { id: '守谷', name: '', path: 'audio/守谷.MP3', color: 'from-emerald-600 to-teal-600' },
                { id: '水海道', name: '', path: 'audio/水海道.MP3', color: 'from-emerald-600 to-teal-600' },
                { id: '下妻', name: '', path: 'audio/下妻.MP3', color: 'from-emerald-600 to-teal-600' },
                { id: '下館', name: '', path: 'audio/下館.MP3', color: 'from-emerald-600 to-teal-600' }
            ],
            status: [
                { id: '見合せています', name: '', path: 'audio/見合せ.MP3', color: 'from-amber-600 to-orange-600' },
                { id: '見合せ(振替有)', name: '', path: 'audio/振替.MP3', color: 'from-amber-600 to-orange-600' },
                { id: '遅延しています', name: '', path: 'audio/遅延.MP3', color: 'from-amber-600 to-orange-600' }
            ]
        };

        // 固定音声ファイル定義
        const fixedAudios = {
            '1': { id: '只今常総線は、', name: '', path: 'audio/1.MP3' },
            '2': { id: 'の影響で', name: '', path: 'audio/2.MP3' },
            '3': { id: 'から', name: '', path: 'audio/3.MP3' },
            '4': { id: 'の間で', name: '', path: 'audio/4.MP3' }
        };

// ============================================================
// 音声キャッシュ
// ============================================================

const audioCache = new Map();

/**
 * 音声オブジェクトを取得
 * 同じファイルについてはAudioを再生成せず再利用する
 */
function getCachedAudio(path) {
    if (!audioCache.has(path)) {
        const audio = new Audio();

        audio.src = path;
        audio.preload = 'auto';

        audioCache.set(path, audio);
    }

    return audioCache.get(path);
}

/**
 * すべての音声を事前ロード
 */
function preloadAllAudios() {
    const paths = new Set();

    // カテゴリ音声
    Object.values(categories).forEach(group => {
        group.forEach(item => {
            paths.add(item.path);
        });
    });

    // 固定音声
    Object.values(fixedAudios).forEach(item => {
        paths.add(item.path);
    });

    paths.forEach(path => {
        const audio = getCachedAudio(path);

        // preloadを明示
        audio.preload = 'auto';

        // ブラウザにロードを促す
        try {
            audio.load();
        } catch (e) {
            console.warn('音声ロード開始エラー:', path, e);
        }
    });

    console.log(`音声キャッシュ準備完了: ${paths.size}ファイル`);
}


// ============================================================
// 選択状態
// ============================================================

let selectedCause = null;
let selectedSections = [];
let selectedStatus = null;


// ============================================================
// 再生状態
// ============================================================

let isPlayingQueue = false;
let currentQueueIndex = -1;
let currentAudioElement = null;
let masterVolume = 1.0;

// 再生セッション番号
// 古い再生処理が新しい再生処理に割り込むのを防止する
let playbackSessionId = 0;


// ============================================================
// ループ関連
// ============================================================

let isLoopEnabled = false;
let loopIntervalSeconds = 10;

let loopTimerId = null;
let countdownTimerId = null;
let remainingCountdown = 0;


// ============================================================
// DOM
// ============================================================

const categoryCauseContainer =
    document.getElementById('category-cause');

const categorySectionContainer =
    document.getElementById('category-section');

const categoryStatusContainer =
    document.getElementById('category-status');

const sequenceDisplay =
    document.getElementById('sequenceDisplay');

const playQueueBtn =
    document.getElementById('playQueueBtn');

const playQueueIcon =
    document.getElementById('playQueueIcon');

const stopQueueBtn =
    document.getElementById('stopQueueBtn');

const resetSelectionBtn =
    document.getElementById('resetSelectionBtn');

const statusBadge =
    document.getElementById('statusBadge');

const currentPlayingLabel =
    document.getElementById('currentPlayingLabel');

const queueProgressCount =
    document.getElementById('queueProgressCount');

const queueProgressBar =
    document.getElementById('queueProgressBar');

const masterVolumeInput =
    document.getElementById('masterVolume');

const masterVolumeVal =
    document.getElementById('masterVolumeVal');

const messageBox =
    document.getElementById('messageBox');

const loopEnableToggle =
    document.getElementById('loopEnableToggle');

const loopSettingsArea =
    document.getElementById('loopSettingsArea');

const loopIntervalRange =
    document.getElementById('loopIntervalRange');

const loopIntervalInput =
    document.getElementById('loopIntervalInput');


// ============================================================
// メッセージ
// ============================================================

function showMessage(text) {
    messageBox.textContent = text;
    messageBox.classList.remove('hidden');

    setTimeout(() => {
        messageBox.classList.add('hidden');
    }, 4000);
}


// ============================================================
// ループ設定
// ============================================================

loopEnableToggle.addEventListener('change', (e) => {

    isLoopEnabled = e.target.checked;

    if (isLoopEnabled) {
        loopSettingsArea.classList.remove(
            'opacity-50',
            'pointer-events-none'
        );
    } else {
        loopSettingsArea.classList.add(
            'opacity-50',
            'pointer-events-none'
        );

        clearLoopTimers();
    }
});


loopIntervalRange.addEventListener('input', (e) => {

    loopIntervalSeconds =
        parseInt(e.target.value, 10) || 0;

    loopIntervalInput.value =
        loopIntervalSeconds;
});


loopIntervalInput.addEventListener('change', (e) => {

    let val =
        parseInt(e.target.value, 10) || 0;

    if (val < 0) val = 0;
    if (val > 300) val = 300;

    loopIntervalSeconds = val;

    loopIntervalInput.value = val;
    loopIntervalRange.value = val;
});


// ============================================================
// カテゴリボタン
// ============================================================

function renderCategoryButtons() {

    renderGroup(
        categories.cause,
        categoryCauseContainer,
        'cause'
    );

    renderGroup(
        categories.section,
        categorySectionContainer,
        'section'
    );

    renderGroup(
        categories.status,
        categoryStatusContainer,
        'status'
    );
}


function renderGroup(items, container, groupType) {

    container.innerHTML = '';

    items.forEach(item => {

        const btn = document.createElement('button');

        const isSelected =
            isItemSelected(groupType, item);

        btn.className =
            `p-2.5 rounded-xl border text-center font-bold
             transition-all transform active:scale-95 ${
                isSelected
                    ? `bg-gradient-to-tr ${item.color}
                       border-white text-white shadow-lg
                       ring-2 ring-indigo-400`
                    : `bg-slate-800/80 border-slate-700/60
                       text-slate-300 hover:bg-slate-700/80`
            }`;

        btn.innerHTML = `
            <div class="text-xs sm:text-sm font-black truncate">
                ${item.id}
            </div>
        `;

        btn.addEventListener(
            'click',
            () => handleSelect(groupType, item)
        );

        container.appendChild(btn);
    });
}


function isItemSelected(groupType, item) {

    if (groupType === 'cause') {
        return selectedCause?.id === item.id;
    }

    if (groupType === 'section') {
        return selectedSections.some(
            s => s.id === item.id
        );
    }

    if (groupType === 'status') {
        return selectedStatus?.id === item.id;
    }

    return false;
}


// ============================================================
// 選択
// ============================================================

function handleSelect(groupType, item) {

    if (isPlayingQueue) {
        showMessage(
            '再生中は選択を変更できません。'
        );
        return;
    }

    if (groupType === 'cause') {

        selectedCause =
            selectedCause?.id === item.id
                ? null
                : item;

    } else if (groupType === 'section') {

        const existsIndex =
            selectedSections.findIndex(
                s => s.id === item.id
            );

        if (existsIndex > -1) {

            selectedSections.splice(
                existsIndex,
                1
            );

        } else {

            if (selectedSections.length >= 2) {
                selectedSections.shift();
            }

            selectedSections.push(item);
        }

    } else if (groupType === 'status') {

        selectedStatus =
            selectedStatus?.id === item.id
                ? null
                : item;
    }

    renderCategoryButtons();
    updateSequenceUI();
}


// ============================================================
// 再生キュー
// ============================================================

function buildPlayQueue() {

    const queue = [];

    queue.push(fixedAudios['1']);

    if (selectedCause) {
        queue.push(selectedCause);
    }

    queue.push(fixedAudios['2']);

    if (selectedSections[0]) {
        queue.push(selectedSections[0]);
    }

    queue.push(fixedAudios['3']);

    if (selectedSections[1]) {
        queue.push(selectedSections[1]);
    }

    queue.push(fixedAudios['4']);

    if (selectedStatus) {
        queue.push(selectedStatus);
    }

    return queue;
}


function isSelectionComplete() {

    return (
        selectedCause !== null &&
        selectedSections.length === 2 &&
        selectedStatus !== null
    );
}


// ============================================================
// シーケンス表示
// ============================================================

function updateSequenceUI() {

    sequenceDisplay.innerHTML = '';

    const queue = buildPlayQueue();

    queue.forEach((item, index) => {

        const isFixed =
            item === fixedAudios['1'] ||
            item === fixedAudios['2'] ||
            item === fixedAudios['3'] ||
            item === fixedAudios['4'];

        const pill =
            document.createElement('div');

        pill.className =
            `flex items-center gap-1.5 px-3 py-1.5
             rounded-xl text-xs font-semibold shadow-sm border ${
                isFixed
                    ? 'bg-slate-800/90 border-slate-600 text-slate-300'
                    : 'bg-indigo-600/30 border-indigo-500/50 text-indigo-200'
             }`;

        pill.innerHTML = `
            <span class="text-[10px] text-slate-400 font-mono">
                ${index + 1}.
            </span>
            <span>${item.id}</span>
        `;

        sequenceDisplay.appendChild(pill);
    });

    const ready = isSelectionComplete();

    if (ready) {

        if (!isPlayingQueue) {
            playQueueBtn.removeAttribute('disabled');
        }

        currentPlayingLabel.textContent =
            '再生準備完了';

    } else {

        playQueueBtn.setAttribute(
            'disabled',
            'true'
        );

        currentPlayingLabel.textContent =
            '原因(1つ)、区間(2つ)、状況(1つ)を選択してください';
    }

    queueProgressCount.textContent =
        `0 / ${queue.length}`;
}


// ============================================================
// リセット
// ============================================================

resetSelectionBtn.addEventListener(
    'click',
    () => {

        if (isPlayingQueue) {
            stopQueue();
        }

        selectedCause = null;
        selectedSections = [];
        selectedStatus = null;

        renderCategoryButtons();
        updateSequenceUI();
    }
);


// ============================================================
// 再生開始
// ============================================================

function playQueueSequence() {

    const queue = buildPlayQueue();

    if (
        queue.length === 0 ||
        !isSelectionComplete()
    ) {
        return;
    }

    clearLoopTimers();

    // 新しい再生セッション
    playbackSessionId++;

    isPlayingQueue = true;
    currentQueueIndex = 0;

    playQueueBtn.setAttribute(
        'disabled',
        'true'
    );

    stopQueueBtn.removeAttribute(
        'disabled'
    );

    playQueueIcon.className =
        'fa-solid fa-rotate animate-spin text-xl';

    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-emerald-500/10 text-emerald-400 ' +
        'border border-emerald-500/20 ' +
        'flex items-center gap-1.5';

    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full ' +
        'bg-emerald-400 animate-pulse"></span>再生中';

    playNextInQueue();
}


// ============================================================
// 次の音声を再生
// ============================================================

function playNextInQueue() {

    if (!isPlayingQueue) {
        return;
    }

    const queue = buildPlayQueue();

    // 1周終了
    if (currentQueueIndex >= queue.length) {

        if (isLoopEnabled) {

            startLoopWait();

        } else {

            finishQueue();

        }

        return;
    }

    const currentSound =
        queue[currentQueueIndex];

    currentPlayingLabel.textContent =
        `再生中 (${currentQueueIndex + 1}/${queue.length}): ${currentSound.id}`;

    queueProgressCount.textContent =
        `${currentQueueIndex + 1} / ${queue.length}`;

    queueProgressBar.style.width =
        `${(currentQueueIndex / queue.length) * 100}%`;


    // --------------------------------------------------------
    // キャッシュされたAudioを取得
    // --------------------------------------------------------

    const audio =
        getCachedAudio(currentSound.path);

    currentAudioElement = audio;

    audio.volume = masterVolume;

    // 前回再生が残っていた場合に確実に停止
    audio.pause();

    // 再生位置を先頭へ
    try {
        audio.currentTime = 0;
    } catch (e) {
        console.warn(
            'currentTime設定エラー:',
            currentSound.path,
            e
        );
    }


    // --------------------------------------------------------
    // イベントを上書き
    // addEventListenerを何度も追加しない
    // --------------------------------------------------------

    audio.onended = null;
    audio.onerror = null;
    audio.ontimeupdate = null;


    // --------------------------------------------------------
    // 再生終了
    // --------------------------------------------------------

    audio.onended = () => {

        if (!isPlayingQueue) {
            return;
        }

        // 次へ
        currentQueueIndex++;

        playNextInQueue();
    };


    // --------------------------------------------------------
    // 再生中の進捗
    // --------------------------------------------------------

    audio.ontimeupdate = () => {

        if (
            !isPlayingQueue ||
            !audio.duration ||
            !isFinite(audio.duration)
        ) {
            return;
        }

        const currentProgress =
            (
                currentQueueIndex +
                audio.currentTime / audio.duration
            ) / queue.length;

        queueProgressBar.style.width =
            `${currentProgress * 100}%`;
    };


    // --------------------------------------------------------
    // 音声エラー
    // --------------------------------------------------------

    audio.onerror = () => {

        console.error(
            'Audio Error:',
            currentSound.path,
            audio.error
        );

        let errorText =
            '音声ファイルを再生できませんでした。';

        if (audio.error) {

            switch (audio.error.code) {

                case MediaError.MEDIA_ERR_ABORTED:
                    errorText =
                        '音声再生が中断されました。';
                    break;

                case MediaError.MEDIA_ERR_NETWORK:
                    errorText =
                        '音声ファイルの読み込み中にネットワークエラーが発生しました。';
                    break;

                case MediaError.MEDIA_ERR_DECODE:
                    errorText =
                        '音声ファイルをデコードできませんでした。';
                    break;

                case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:
                    errorText =
                        '音声ファイルが見つからないか、形式に対応していません。';
                    break;
            }
        }

        showMessage(
            `${currentSound.path}: ${errorText}`
        );

        // エラーが起きてもキュー全体を止めない
        if (isPlayingQueue) {

            currentQueueIndex++;

            setTimeout(() => {

                if (isPlayingQueue) {
                    playNextInQueue();
                }

            }, 100);
        }
    };


    // --------------------------------------------------------
    // 再生
    // --------------------------------------------------------

    const playPromise = audio.play();

    if (playPromise !== undefined) {

        playPromise.catch(err => {

            console.error(
                'Audio.play() failed:',
                currentSound.path,
                err
            );

            // onerrorと二重処理になる場合があるので
            // 状態を確認してから次へ進む

            if (!isPlayingQueue) {
                return;
            }

            showMessage(
                `「${currentSound.path}」を再生できませんでした。`
            );

            currentQueueIndex++;

            setTimeout(() => {

                if (isPlayingQueue) {
                    playNextInQueue();
                }

            }, 100);
        });
    }
}


// ============================================================
// 1周終了
// ============================================================

function finishQueue() {

    isPlayingQueue = false;

    clearLoopTimers();

    if (currentAudioElement) {
        currentAudioElement.pause();

        try {
            currentAudioElement.currentTime = 0;
        } catch (e) {}

        currentAudioElement = null;
    }

    currentQueueIndex = -1;

    playQueueIcon.className =
        'fa-solid fa-play text-xl ml-0.5';

    stopQueueBtn.setAttribute(
        'disabled',
        'true'
    );

    if (isSelectionComplete()) {
        playQueueBtn.removeAttribute(
            'disabled'
        );
    }

    currentPlayingLabel.textContent =
        '再生完了！';

    queueProgressBar.style.width =
        '100%';

    const queue = buildPlayQueue();

    queueProgressCount.textContent =
        `${queue.length} / ${queue.length}`;

    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-indigo-500/10 text-indigo-400 ' +
        'border border-indigo-500/20 ' +
        'flex items-center gap-1.5';

    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full ' +
        'bg-indigo-400"></span>完了';
}


// ============================================================
// ループ待機
// ============================================================

function startLoopWait() {

    if (!isPlayingQueue) {
        return;
    }

    remainingCountdown =
        loopIntervalSeconds;

    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-amber-500/10 text-amber-400 ' +
        'border border-amber-500/20 ' +
        'flex items-center gap-1.5';

    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full ' +
        'bg-amber-400 animate-ping"></span>ループ待機中';


    if (remainingCountdown <= 0) {

        restartQueue();

        return;
    }


    updateCountdownLabel();

    clearLoopTimers();

    countdownTimerId =
        setInterval(() => {

            if (!isPlayingQueue) {
                clearLoopTimers();
                return;
            }

            remainingCountdown--;

            if (remainingCountdown <= 0) {

                clearInterval(
                    countdownTimerId
                );

                countdownTimerId = null;

                restartQueue();

            } else {

                updateCountdownLabel();
            }

        }, 1000);
}


// ============================================================
// ループ再開
// ============================================================

function restartQueue() {

    if (!isPlayingQueue) {
        return;
    }

    clearLoopTimers();

    currentQueueIndex = 0;

    queueProgressBar.style.width =
        '0%';

    playNextInQueue();
}


// ============================================================
// カウントダウン表示
// ============================================================

function updateCountdownLabel() {

    currentPlayingLabel.textContent =
        `ループ再生待機中 (${remainingCountdown}秒後に再再生)...`;
}


// ============================================================
// タイマー解除
// ============================================================

function clearLoopTimers() {

    if (loopTimerId) {
        clearTimeout(loopTimerId);
        loopTimerId = null;
    }

    if (countdownTimerId) {
        clearInterval(countdownTimerId);
        countdownTimerId = null;
    }
}


// ============================================================
// 停止
// ============================================================

function stopQueue() {

    // セッションを無効化
    playbackSessionId++;

    isPlayingQueue = false;

    clearLoopTimers();

    if (currentAudioElement) {

        currentAudioElement.pause();

        try {
            currentAudioElement.currentTime = 0;
        } catch (e) {}

        currentAudioElement.onended = null;
        currentAudioElement.onerror = null;
        currentAudioElement.ontimeupdate = null;

        currentAudioElement = null;
    }

    currentQueueIndex = -1;

    playQueueIcon.className =
        'fa-solid fa-play text-xl ml-0.5';

    stopQueueBtn.setAttribute(
        'disabled',
        'true'
    );

    if (isSelectionComplete()) {

        playQueueBtn.removeAttribute(
            'disabled'
        );
    }

    currentPlayingLabel.textContent =
        '再生停止';

    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-indigo-500/10 text-indigo-400 ' +
        'border border-indigo-500/20 ' +
        'flex items-center gap-1.5';

    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full ' +
        'bg-indigo-400"></span>準備完了';
}


// ============================================================
// 再生ボタン
// ============================================================

playQueueBtn.addEventListener(
    'click',
    () => {

        if (!isPlayingQueue) {
            playQueueSequence();
        }
    }
);


stopQueueBtn.addEventListener(
    'click',
    stopQueue
);


// ============================================================
// 音量
// ============================================================

masterVolumeInput.addEventListener(
    'input',
    (e) => {

        masterVolume =
            parseFloat(e.target.value);

        masterVolumeVal.textContent =
            `${Math.round(masterVolume * 100)}%`;

        // キャッシュされているすべてのAudioに反映
        audioCache.forEach(audio => {
            audio.volume = masterVolume;
        });
    }
);


// ============================================================
// タブレットのページ復帰対策
// ============================================================

document.addEventListener(
    'visibilitychange',
    () => {

        if (
            document.visibilityState === 'visible' &&
            isPlayingQueue &&
            currentAudioElement
        ) {

            console.log(
                'ページが復帰しました'
            );

            // 再生が意図せず止まっていた場合
            if (
                currentAudioElement.paused &&
                !currentAudioElement.ended
            ) {

                currentAudioElement.play()
                    .catch(err => {

                        console.warn(
                            'ページ復帰後の再生再開に失敗:',
                            err
                        );
                    });
            }
        }
    }
);


// ============================================================
// 初期化
// ============================================================

window.onload = () => {

    renderCategoryButtons();

    updateSequenceUI();

    // 音声を先にキャッシュ
    preloadAllAudios();

    console.log(
        '音声連続再生システム 初期化完了'
    );
};
</script>
