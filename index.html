/* ============================================================
   Web Audio API
============================================================ */

let audioContext = null;

let masterGainNode = null;


/*
 * MP3をデコードしたAudioBufferを保存
 *
 * path
 *   ↓
 * AudioBuffer
 */
const audioBufferCache = new Map();


/*
 * 現在の結合済みAudioBuffer
 */
let currentCombinedBuffer = null;


/*
 * 現在のAudioBufferSourceNode
 */
let currentSource = null;


/*
 * 再生開始時刻
 */
let playbackStartTime = 0;


/*
 * 進捗更新用requestAnimationFrame
 */

/*
 * 現在の音声ごとの開始位置
 */
let currentSegmentInfo = [];


/*
 * AudioContextを作成
 */
function initAudioContext() {

    if (!audioContext) {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContextClass) {

            throw new Error(
                'このブラウザはWeb Audio APIに対応していません。'
            );
        }

        audioContext =
            new AudioContextClass();


        masterGainNode =
            audioContext.createGain();


        masterGainNode.gain.value =
            masterVolume;


        masterGainNode.connect(
            audioContext.destination
        );

    }


    return audioContext;
}


/*
 * AudioContextを再開
 *
 * iPad Safari対策
 */
async function resumeAudioContext() {

    initAudioContext();

    if (
        audioContext.state === 'suspended'
    ) {

        await audioContext.resume();

    }

}


/* ============================================================
   音声ファイルをデコード
============================================================ */

async function loadAudioBuffer(path) {

    /*
     * すでにデコード済みなら再利用
     */

    if (audioBufferCache.has(path)) {

        return audioBufferCache.get(path);

    }


    console.log(
        '音声読み込み:',
        path
    );


    /*
     * 日本語ファイル名にも対応
     */

    const encodedPath =
        encodeURI(path);


    const response =
        await fetch(encodedPath, {
            cache: 'force-cache'
        });


    if (!response.ok) {

        throw new Error(
            `音声ファイルを取得できません: ${path} (${response.status})`
        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    /*
     * decodeAudioData
     */

    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    /*
     * キャッシュ
     */

    audioBufferCache.set(
        path,
        audioBuffer
    );


    console.log(
        'デコード完了:',
        path,
        `${audioBuffer.duration.toFixed(2)}秒`
    );


    return audioBuffer;
}


/* ============================================================
   AudioBufferを結合
============================================================ */

function combineAudioBuffers(buffers) {

    if (!buffers.length) {

        return null;

    }


    /*
     * 今回の音声ファイルは基本的に
     * 同じMP3仕様であることを想定
     *
     * 1つ目の音声を基準にする
     */

    const sampleRate =
        buffers[0].sampleRate;


    /*
     * ステレオ音源とモノラル音源が混ざっていても
     * ある程度対応できるよう最大チャンネル数を使用
     */

    const numberOfChannels =
        Math.max(
            ...buffers.map(
                buffer => buffer.numberOfChannels
            )
        );


    /*
     * 全体のサンプル数
     */

    let totalLength = 0;


    buffers.forEach(buffer => {

        /*
         * 通常は同じsampleRateなのでそのまま使用
         *
         * 万一違う場合は時間比率で調整
         */

        const adjustedLength =
            Math.round(
                buffer.length *
                sampleRate /
                buffer.sampleRate
            );

        totalLength += adjustedLength;

    });


    /*
     * 結合後のAudioBuffer
     */

    const combinedBuffer =
        audioContext.createBuffer(
            numberOfChannels,
            totalLength,
            sampleRate
        );


    /*
     * 各音声の開始位置を記録
     *
     * 進捗表示に使用
     */

    currentSegmentInfo = [];


    let offset = 0;


    buffers.forEach((buffer, index) => {

        const startSample =
            offset;


        const duration =
            buffer.duration;


        /*
         * sampleRateが同じ場合
         */

        if (
            buffer.sampleRate === sampleRate
        ) {

            for (
                let channel = 0;
                channel < numberOfChannels;
                channel++
            ) {

                const target =
                    combinedBuffer.getChannelData(
                        channel
                    );


                if (
                    channel <
                    buffer.numberOfChannels
                ) {

                    target.set(
                        buffer.getChannelData(channel),
                        offset
                    );

                } else {

                    /*
                     * モノラル → ステレオなどの場合
                     * 反対チャンネルにもコピー
                     */

                    if (
                        buffer.numberOfChannels === 1
                    ) {

                        target.set(
                            buffer.getChannelData(0),
                            offset
                        );

                    }

                }

            }


            offset += buffer.length;

        } else {

            /*
             * sampleRateが違う場合
             *
             * 簡易リサンプリング
             */

            const ratio =
                sampleRate /
                buffer.sampleRate;


            const newLength =
                Math.round(
                    buffer.length * ratio
                );


            for (
                let channel = 0;
                channel < numberOfChannels;
                channel++
            ) {

                const target =
                    combinedBuffer.getChannelData(
                        channel
                    );


                const sourceChannel =
                    Math.min(
                        channel,
                        buffer.numberOfChannels - 1
                    );


                const source =
                    buffer.getChannelData(
                        sourceChannel
                    );


                for (
                    let i = 0;
                    i < newLength;
                    i++
                ) {

                    const sourceIndex =
                        Math.min(
                            Math.floor(i / ratio),
                            source.length - 1
                        );


                    target[
                        offset + i
                    ] =
                        source[sourceIndex];

                }

            }


            offset += newLength;

        }


        currentSegmentInfo.push({

            index,

            startTime:
                startSample / sampleRate,

            endTime:
                offset / sampleRate,

            duration

        });

    });


    return combinedBuffer;
}


/* ============================================================
   キューを1本のAudioBufferへ変換
============================================================ */

async function buildCombinedAudioBuffer(queue) {

    const buffers = [];


    for (
        let i = 0;
        i < queue.length;
        i++
    ) {

        /*
         * 選択を変更・停止された場合は中止
         */

        if (!isPlayingQueue) {

            return null;

        }


        const item =
            queue[i];


        /*
         * 現在の準備状況を表示
         */

        currentPlayingLabel.textContent =
            `音声準備中 (${i + 1}/${queue.length}): ${item.id}`;


        queueProgressCount.textContent =
            `${i + 1} / ${queue.length}`;


        const buffer =
            await loadAudioBuffer(
                item.path
            );


        buffers.push(buffer);

    }


    return combineAudioBuffers(
        buffers
    );
}


/* ============================================================
   選択状態
============================================================ */

let selectedCause = null;

let selectedSections = [];

let selectedStatus = null;


/* ============================================================
   再生状態
============================================================ */

let isPlayingQueue = false;

let currentQueueIndex = -1;

let masterVolume = 1.0;


/*
 * 古い再生処理を無効化するセッション番号
 */

let playbackSessionId = 0;


/* ============================================================
   ループ
============================================================ */

let isLoopEnabled = false;

let loopIntervalSeconds = 10;

let countdownTimerId = null;

let remainingCountdown = 0;


/* ============================================================
   DOM
============================================================ */

const categoryCauseContainer =
    document.getElementById(
        'category-cause'
    );


const categorySectionContainer =
    document.getElementById(
        'category-section'
    );


const categoryStatusContainer =
    document.getElementById(
        'category-status'
    );


const sequenceDisplay =
    document.getElementById(
        'sequenceDisplay'
    );


const playQueueBtn =
    document.getElementById(
        'playQueueBtn'
    );


const playQueueIcon =
    document.getElementById(
        'playQueueIcon'
    );


const stopQueueBtn =
    document.getElementById(
        'stopQueueBtn'
    );


const resetSelectionBtn =
    document.getElementById(
        'resetSelectionBtn'
    );


const statusBadge =
    document.getElementById(
        'statusBadge'
    );


const currentPlayingLabel =
    document.getElementById(
        'currentPlayingLabel'
    );


const queueProgressCount =
    document.getElementById(
        'queueProgressCount'
    );


const queueProgressBar =
    document.getElementById(
        'queueProgressBar'
    );


const masterVolumeInput =
    document.getElementById(
        'masterVolume'
    );


const masterVolumeVal =
    document.getElementById(
        'masterVolumeVal'
    );


const messageBox =
    document.getElementById(
        'messageBox'
    );


const loopEnableToggle =
    document.getElementById(
        'loopEnableToggle'
    );


const loopSettingsArea =
    document.getElementById(
        'loopSettingsArea'
    );


const loopIntervalRange =
    document.getElementById(
        'loopIntervalRange'
    );


const loopIntervalInput =
    document.getElementById(
        'loopIntervalInput'
    );


/* ============================================================
   メッセージ
============================================================ */

let messageTimerId = null;


function showMessage(text) {

    messageBox.textContent =
        text;

    messageBox.classList.remove(
        'hidden'
    );


    if (messageTimerId) {

        clearTimeout(
            messageTimerId
        );

    }


    messageTimerId =
        setTimeout(() => {

            messageBox.classList.add(
                'hidden'
            );

        }, 5000);

}


/* ============================================================
   ループ設定
============================================================ */

loopEnableToggle.addEventListener(
    'change',
    (e) => {

        isLoopEnabled =
            e.target.checked;


        if (isLoopEnabled) {

            loopSettingsArea.classList.remove(
                'opacity-50',
                'pointer-events-none'
            );

        } else {

            loopSettingsArea.classList.add(
                'opacity-50',
                'pointer-events-none'
            );

            clearLoopTimers();

        }

    }
);


loopIntervalRange.addEventListener(
    'input',
    (e) => {

        loopIntervalSeconds =
            parseInt(
                e.target.value,
                10
            ) || 0;


        loopIntervalInput.value =
            loopIntervalSeconds;

    }
);


loopIntervalInput.addEventListener(
    'change',
    (e) => {

        let val =
            parseInt(
                e.target.value,
                10
            ) || 0;


        if (val < 0) {
            val = 0;
        }


        if (val > 300) {
            val = 300;
        }


        loopIntervalSeconds =
            val;


        loopIntervalInput.value =
            val;


        loopIntervalRange.value =
            val;

    }
);


/* ============================================================
   カテゴリボタン
============================================================ */

function renderCategoryButtons() {

    renderGroup(
        categories.cause,
        categoryCauseContainer,
        'cause'
    );


    renderGroup(
        categories.section,
        categorySectionContainer,
        'section'
    );


    renderGroup(
        categories.status,
        categoryStatusContainer,
        'status'
    );

}


function renderGroup(
    items,
    container,
    groupType
) {

    container.innerHTML = '';


    items.forEach(item => {

        const btn =
            document.createElement(
                'button'
            );


        const isSelected =
            isItemSelected(
                groupType,
                item
            );


        btn.className =
            `p-2.5 rounded-xl border text-center font-bold
             transition-all transform active:scale-95 ${
                isSelected
                    ? `bg-gradient-to-tr ${item.color}
                       border-white text-white shadow-lg
                       ring-2 ring-indigo-400`
                    : `bg-slate-800/80 border-slate-700/60
                       text-slate-300 hover:bg-slate-700/80`
            }`;


        btn.innerHTML = `
            <div class="text-xs sm:text-sm font-black truncate">
                ${item.id}
            </div>
        `;


        btn.addEventListener(
            'click',
            () => handleSelect(
                groupType,
                item
            )
        );


        container.appendChild(
            btn
        );

    });

}


function isItemSelected(
    groupType,
    item
) {

    if (groupType === 'cause') {

        return selectedCause?.id === item.id;

    }


    if (groupType === 'section') {

        return selectedSections.some(
            s => s.id === item.id
        );

    }


    if (groupType === 'status') {

        return selectedStatus?.id === item.id;

    }


    return false;
}


/* ============================================================
   選択
============================================================ */

function handleSelect(
    groupType,
    item
) {

    if (isPlayingQueue) {

        showMessage(
            '再生中は選択を変更できません。'
        );

        return;

    }


    if (groupType === 'cause') {

        selectedCause =
            selectedCause?.id === item.id
                ? null
                : item;

    }


    else if (
        groupType === 'section'
    ) {

        const existsIndex =
            selectedSections.findIndex(
                s => s.id === item.id
            );


        if (existsIndex > -1) {

            selectedSections.splice(
                existsIndex,
                1
            );

        } else {

            if (
                selectedSections.length >= 2
            ) {

                selectedSections.shift();

            }


            selectedSections.push(
                item
            );

        }

    }


    else if (
        groupType === 'status'
    ) {

        selectedStatus =
            selectedStatus?.id === item.id
                ? null
                : item;

    }


    /*
     * 選択変更時は結合済み音声を破棄
     *
     * 個別AudioBufferのキャッシュは残す
     */

    currentCombinedBuffer = null;


    renderCategoryButtons();

    updateSequenceUI();

}


/* ============================================================
   再生キュー
============================================================ */

function buildPlayQueue() {

    const queue = [];


    queue.push(
        fixedAudios['1']
    );


    if (selectedCause) {

        queue.push(
            selectedCause
        );

    }


    queue.push(
        fixedAudios['2']
    );


    if (selectedSections[0]) {

        queue.push(
            selectedSections[0]
        );

    }


    queue.push(
        fixedAudios['3']
    );


    if (selectedSections[1]) {

        queue.push(
            selectedSections[1]
        );

    }


    queue.push(
        fixedAudios['4']
    );


    if (selectedStatus) {

        queue.push(
            selectedStatus
        );

    }


    return queue;
}


function isSelectionComplete() {

    return (
        selectedCause !== null &&
        selectedSections.length === 2 &&
        selectedStatus !== null
    );

}


/* ============================================================
   シーケンス表示
============================================================ */

function updateSequenceUI() {

    sequenceDisplay.innerHTML = '';


    const queue =
        buildPlayQueue();


    queue.forEach(
        (item, index) => {

            const isFixed =
                item === fixedAudios['1'] ||
                item === fixedAudios['2'] ||
                item === fixedAudios['3'] ||
                item === fixedAudios['4'];


            const pill =
                document.createElement(
                    'div'
                );


            pill.className =
                `flex items-center gap-1.5 px-3 py-1.5
                 rounded-xl text-xs font-semibold shadow-sm border ${
                    isFixed
                        ? 'bg-slate-800/90 border-slate-600 text-slate-300'
                        : 'bg-indigo-600/30 border-indigo-500/50 text-indigo-200'
                 }`;


            pill.innerHTML = `
                <span class="text-[10px] text-slate-400 font-mono">
                    ${index + 1}.
                </span>

                <span>${item.id}</span>
            `;


            sequenceDisplay.appendChild(
                pill
            );

        }
    );


    const ready =
        isSelectionComplete();


    if (ready) {

        if (!isPlayingQueue) {

            playQueueBtn.removeAttribute(
                'disabled'
            );

        }


        currentPlayingLabel.textContent =
            '再生準備完了';

    } else {

        playQueueBtn.setAttribute(
            'disabled',
            'true'
        );


        currentPlayingLabel.textContent =
            '原因(1つ)、区間(2つ)、状況(1つ)を選択してください';

    }


    queueProgressCount.textContent =
        `0 / ${queue.length}`;

}


/* ============================================================
   リセット
============================================================ */

resetSelectionBtn.addEventListener(
    'click',
    () => {

        if (isPlayingQueue) {

            stopQueue();

        }


        selectedCause = null;

        selectedSections = [];

        selectedStatus = null;


        currentCombinedBuffer = null;


        renderCategoryButtons();

        updateSequenceUI();

    }
);


/* ============================================================
   再生開始
============================================================ */

async function playQueueSequence() {

    const queue =
        buildPlayQueue();


    if (
        queue.length === 0 ||
        !isSelectionComplete()
    ) {

        return;

    }


    /*
     * 新しいセッション
     */

    playbackSessionId++;


    const sessionId =
        playbackSessionId;


    isPlayingQueue = true;


    currentQueueIndex = 0;


    playQueueBtn.setAttribute(
        'disabled',
        'true'
    );


    stopQueueBtn.removeAttribute(
        'disabled'
    );


    playQueueIcon.className =
        'fa-solid fa-spinner animate-spin text-xl';


    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-blue-500/10 text-blue-400 ' +
        'border border-blue-500/20 ' +
        'flex items-center gap-1.5';


    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full ' +
        'bg-blue-400 animate-pulse"></span>準備中';


    try {

        /*
         * 再生ボタンのユーザー操作内で
         * AudioContextを開始
         */

        await resumeAudioContext();


        /*
         * 音声を全部デコードして結合
         */

        const combinedBuffer =
            await buildCombinedAudioBuffer(
                queue
            );


        /*
         * 停止されていたら終了
         */

        if (
            !isPlayingQueue ||
            sessionId !== playbackSessionId ||
            !combinedBuffer
        ) {

            return;

        }


        currentCombinedBuffer =
            combinedBuffer;


        /*
         * 1本のAudioBufferとして再生
         */

        playCombinedBuffer(
            combinedBuffer,
            sessionId,
            queue
        );


    } catch (error) {

        console.error(
            '音声準備エラー:',
            error
        );


        showMessage(
            `音声の準備に失敗しました: ${error.message}`
        );


        finishQueue();

    }

}


/* ============================================================
   AudioBuffer再生
============================================================ */

function playCombinedBuffer(
    buffer,
    sessionId,
    queue
) {

    if (
        !audioContext ||
        !masterGainNode ||
        !buffer
    ) {

        return;

    }


    /*
     * 前のSourceを停止
     */

    if (currentSource) {

        try {

            currentSource.stop();

        } catch (e) {}


        try {

            currentSource.disconnect();

        } catch (e) {}


        currentSource = null;

    }


    /*
     * AudioBufferSourceNodeは
     * 再生するたびに新しく作る
     */

    const source =
        audioContext.createBufferSource();


    source.buffer =
        buffer;


    source.connect(
        masterGainNode
    );


    currentSource =
        source;


    playbackStartTime =
        audioContext.currentTime;


    currentPlayingLabel.textContent =
        '再生中';


    queueProgressCount.textContent =
        `1 / ${queue.length}`;


    queueProgressBar.style.width =
        '0%';


    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-emerald-500/10 text-emerald-400 ' +
        'border border-emerald-500/20 ' +
        'flex items-center gap-1.5';


    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full ' +
        'bg-emerald-400 animate-pulse"></span>再生中';


    /*
     * 再生終了
     */

    source.onended = () => {

        if (
            !isPlayingQueue ||
            sessionId !== playbackSessionId
        ) {

            return;

        }


        currentSource = null;


        stopProgressAnimation();


        queueProgressBar.style.width =
            '100%';


        queueProgressCount.textContent =
            `${queue.length} / ${queue.length}`;


        if (isLoopEnabled) {

            startLoopWait();

        } else {

            finishQueue();

        }

    };


    /*
     * 1回だけ開始
     *
     * ここがHTMLAudio方式との最大の違い
     */

    try {

        source.start(0);

    } catch (error) {

        console.error(
            'AudioBuffer再生開始エラー:',
            error
        );


        showMessage(
            '音声の再生を開始できませんでした。'
        );


        finishQueue();

        return;

    }


    /*
     * 進捗表示開始
     */

    updateCombinedProgress(
        buffer,
        queue,
        sessionId
    );

}


/* ============================================================
   進捗表示
============================================================ */

function updateCombinedProgress(
    buffer,
    queue,
    sessionId
) {

    stopProgressAnimation();


    function update() {

        if (
            !isPlayingQueue ||
            sessionId !== playbackSessionId ||
            !audioContext ||
            !currentSource
        ) {

            return;

        }


        const elapsed =
            audioContext.currentTime -
            playbackStartTime;


        const progress =
            Math.min(
                Math.max(
                    elapsed /
                    buffer.duration,
                    0
                ),
                1
            );


        queueProgressBar.style.width =
            `${progress * 100}%`;


        /*
         * 現在どの音声を再生しているか
         */

        let currentIndex = 0;


        for (
            let i = 0;
            i < currentSegmentInfo.length;
            i++
        ) {

            const segment =
                currentSegmentInfo[i];


            if (
                elapsed >= segment.startTime &&
                elapsed < segment.endTime
            ) {

                currentIndex =
                    i;

                break;

            }


            /*
             * 最後の瞬間
             */

            if (
                elapsed >= segment.endTime
            ) {

                currentIndex =
                    i;

            }

        }


        currentQueueIndex =
            currentIndex;


        const currentItem =
            queue[currentIndex];


        if (currentItem) {

            currentPlayingLabel.textContent =
                `再生中 (${currentIndex + 1}/${queue.length}): ${currentItem.id}`;

        }


        queueProgressCount.textContent =
            `${currentIndex + 1} / ${queue.length}`;


        progressAnimationId =
            requestAnimationFrame(
                update
            );

    }


    progressAnimationId =
        requestAnimationFrame(
            update
        );

}


function stopProgressAnimation() {

    if (
        progressAnimationId !== null
    ) {

        cancelAnimationFrame(
            progressAnimationId
        );


        progressAnimationId =
            null;

    }

}


/* ============================================================
   1周終了
============================================================ */

function finishQueue() {

    isPlayingQueue = false;


    clearLoopTimers();

    stopProgressAnimation();


    if (currentSource) {

        try {

            currentSource.stop();

        } catch (e) {}


        try {

            currentSource.disconnect();

        } catch (e) {}


        currentSource = null;

    }


    currentQueueIndex = -1;


    playQueueIcon.className =
        'fa-solid fa-play text-xl ml-0.5';


    stopQueueBtn.setAttribute(
        'disabled',
        'true'
    );


    if (isSelectionComplete()) {

        playQueueBtn.removeAttribute(
            'disabled'
        );

    }


    currentPlayingLabel.textContent =
        '再生完了！';


    queueProgressBar.style.width =
        '100%';


    const queue =
        buildPlayQueue();


    queueProgressCount.textContent =
        `${queue.length} / ${queue.length}`;


    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-indigo-500/10 text-indigo-400 ' +
        'border border-indigo-500/20 ' +
        'flex items-center gap-1.5';


    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full ' +
        'bg-indigo-400"></span>完了';

}


/* ============================================================
   ループ待機
============================================================ */

function startLoopWait() {

    if (!isPlayingQueue) {

        return;

    }


    remainingCountdown =
        loopIntervalSeconds;


    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-amber-500/10 text-amber-400 ' +
        'border border-amber-500/20 ' +
        'flex items-center gap-1.5';


    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full ' +
        'bg-amber-400 animate-ping"></span>ループ待機中';


    if (
        remainingCountdown <= 0
    ) {

        restartQueue();

        return;

    }


    updateCountdownLabel();


    clearLoopTimers();


    countdownTimerId =
        setInterval(
            () => {

                if (!isPlayingQueue) {

                    clearLoopTimers();

                    return;

                }


                remainingCountdown--;


                if (
                    remainingCountdown <= 0
                ) {

                    clearInterval(
                        countdownTimerId
                    );


                    countdownTimerId =
                        null;


                    restartQueue();

                } else {

                    updateCountdownLabel();

                }

            },
            1000
        );

}


/* ============================================================
   ループ再開
============================================================ */

function restartQueue() {

    if (!isPlayingQueue) {

        return;

    }


    clearLoopTimers();


    /*
     * 同じCombined AudioBufferを再利用
     *
     * MP3を再ロード・再デコードしない
     */

    if (!currentCombinedBuffer) {

        /*
         * 万一バッファが無ければ
         * 最初から準備
         */

        playQueueSequence();

        return;

    }


    currentQueueIndex = 0;


    queueProgressBar.style.width =
        '0%';


    const queue =
        buildPlayQueue();


    playbackSessionId++;


    const sessionId =
        playbackSessionId;


    playCombinedBuffer(
        currentCombinedBuffer,
        sessionId,
        queue
    );

}


/* ============================================================
   カウントダウン
============================================================ */

function updateCountdownLabel() {

    currentPlayingLabel.textContent =
        `ループ再生待機中 (${remainingCountdown}秒後に再再生)...`;

}


/* ============================================================
   タイマー解除
============================================================ */

function clearLoopTimers() {

    if (
        countdownTimerId
    ) {

        clearInterval(
            countdownTimerId
        );


        countdownTimerId =
            null;

    }

}


/* ============================================================
   停止
============================================================ */

function stopQueue() {

    /*
     * 古い非同期処理を無効化
     */

    playbackSessionId++;


    isPlayingQueue = false;


    clearLoopTimers();


    stopProgressAnimation();


    /*
     * AudioBufferSourceNodeを停止
     */

    if (currentSource) {

        try {

            currentSource.stop();

        } catch (e) {}


        try {

            currentSource.disconnect();

        } catch (e) {}


        currentSource = null;

    }


    currentQueueIndex = -1;


    playQueueIcon.className =
        'fa-solid fa-play text-xl ml-0.5';


    stopQueueBtn.setAttribute(
        'disabled',
        'true'
    );


    if (isSelectionComplete()) {

        playQueueBtn.removeAttribute(
            'disabled'
        );

    }


    currentPlayingLabel.textContent =
        '再生停止';


    queueProgressBar.style.width =
        '0%';


    const queue =
        buildPlayQueue();


    queueProgressCount.textContent =
        `0 / ${queue.length}`;


    statusBadge.className =
        'px-3 py-1 rounded-full text-xs font-medium ' +
        'bg-indigo-500/10 text-indigo-400 ' +
        'border border-indigo-500/20 ' +
        'flex items-center gap-1.5';


    statusBadge.innerHTML =
        '<span class="w-2 h-2 rounded-full ' +
        'bg-indigo-400"></span>準備完了';

}


/* ============================================================
   再生ボタン
============================================================ */

playQueueBtn.addEventListener(
    'click',
    () => {

        if (!isPlayingQueue) {

            /*
             * ここからplayQueueSequenceを呼ぶことが重要
             *
             * iPad Safariのユーザー操作による
             * AudioContext開始に利用する
             */

            playQueueSequence();

        }

    }
);


stopQueueBtn.addEventListener(
    'click',
    stopQueue
);


/* ============================================================
   音量
============================================================ */

masterVolumeInput.addEventListener(
    'input',
    (e) => {

        masterVolume =
            parseFloat(
                e.target.value
            );


        masterVolumeVal.textContent =
            `${Math.round(masterVolume * 100)}%`;


        if (masterGainNode) {

            masterGainNode.gain.value =
                masterVolume;

        }

    }
);


/* ============================================================
   ページ復帰
============================================================ */

document.addEventListener(
    'visibilitychange',
    async () => {

        if (
            document.visibilityState === 'visible' &&
            isPlayingQueue &&
            audioContext
        ) {

            console.log(
                'ページが復帰しました'
            );


            /*
             * iPad SafariでAudioContextが
             * suspendedになった場合に復帰
             */

            if (
                audioContext.state === 'suspended'
            ) {

                try {

                    await audioContext.resume();

                } catch (error) {

                    console.warn(
                        'AudioContext再開失敗:',
                        error
                    );

                }

            }

        }

    }
);


/* ============================================================
   初期化
============================================================ */

window.onload = () => {

    renderCategoryButtons();

    updateSequenceUI();


    console.log(
        '音声連続再生システム 初期化完了'
    );

};

</script>
