<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="format-detection"
        content="telephone=no"
    >

    <title>音声連続再生システム ver1.7</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #020617;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Kaku Gothic ProN",
                "Hiragino Sans",
                Meiryo,
                sans-serif;

            color: #f8fafc;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(79, 70, 229, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #020617 0%,
                    #1e1b4b 50%,
                    #020617 100%
                );

            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        input {
            -webkit-appearance: none;
        }

        .safe-area {
            padding-top:
                max(16px, env(safe-area-inset-top));

            padding-bottom:
                max(16px, env(safe-area-inset-bottom));

            padding-left:
                max(16px, env(safe-area-inset-left));

            padding-right:
                max(16px, env(safe-area-inset-right));
        }

        .glass {
            background: rgba(15, 23, 42, 0.92);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .hidden-force {
            display: none !important;
        }

        .loading-spinner {
            width: 18px;
            height: 18px;

            border: 2px solid
                rgba(255, 255, 255, 0.20);

            border-top-color: #818cf8;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .play-spin {
            animation:
                playSpin 1.5s linear infinite;
        }

        @keyframes playSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .progress-transition {
            transition: width 0.08s linear;
        }

        .selection-ring {
            box-shadow:
                0 0 0 2px rgba(129, 140, 248, 0.65),
                0 8px 25px rgba(79, 70, 229, 0.25);
        }

        .debug-ok {
            color: #34d399;
        }

        .debug-warning {
            color: #fbbf24;
        }

        .debug-error {
            color: #fb7185;
        }
    </style>
</head>


<body class="min-h-screen safe-area">


<!-- ============================================================
     LOGIN
============================================================ -->

<div
    id="loginScreen"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95"
>

    <div

               shadow-2xl p-6 md:p-8"
    >

        <div class="text-center mb-7">

            <div

                       bg-indigo-600/20

                    class="fa-solid fa-volume-high

            </div>

            <h1 class="text-xl font-bold text-white">
                音声連続再生システム
            </h1>

            <p class="text-xs text-slate-400 mt-2">
                ログインしてシステムを利用してください
            </p>

        </div>


        <form
            id="loginForm"
            class="space-y-4"
        >

            <div>

                <label
                    class="block text-xs font-semibold

                    ユーザー名
                </label>

                <div class="relative">

                    <i
                        class="fa-solid fa-user

                               -translate-y-1/2
                               text-slate-500 text-sm"
                    ></i>

                    <input
                        id="username"
                        type="text"
                        autocomplete="username"
                        autocapitalize="none"
                        autocorrect="off"
                        spellcheck="false"
                        required
                        class="w-full
                               bg-slate-950/70
                               border border-slate-700
                               rounded-xl
                               pl-10 pr-4 py-3
                               text-sm text-white
                               outline-none
                               focus:border-indigo-500"

                </div>

            </div>


            <div>

                <label
                    class="block text-xs font-semibold
                           text-slate-300 mb-1.5"

                    パスワード
                </label>

                <div class="relative">

                    <i
                        class="fa-solid fa-key
                               absolute left-3.5 top-1/2
                               -translate-y-1/2
                               text-slate-500 text-sm"
                    ></i>

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        class="w-full
                               bg-slate-950/70
                               border border-slate-700
                               rounded-xl
                               pl-10 pr-4 py-3
                               text-sm text-white
                               outline-none
                               focus:border-indigo-500"

                </div>

            </div>


            <div
                id="loginError"

                       bg-rose-500/10
                       border border-rose-500/20
                       rounded-xl p-3 text-center"
            >
                ユーザー名またはパスワードが違います
            </div>


            <button
                id="loginButton"
                type="submit"
                class="w-full
                       bg-indigo-600
                       active:bg-indigo-700
                       text-white
                       font-bold
                       py-3
                       rounded-xl
                       shadow-lg
                       shadow-indigo-600/30
                       transition-all
                       flex items-center
                       justify-center gap-2"
            >
                <i class="fa-solid fa-right-to-bracket"></i>
                ログイン
            </button>

        </form>


        <div
            class="mt-5 text-[11px]
                   text-slate-500
                   text-center"
        >
            iPad / Safari対応音声エンジン
        </div>

    </div>
</div>

            <div

    </div>

</main>

/* ============================================================
   AUDIO CONTEXT CREATION
============================================================ */

/*
 * 重要：
 *
 * AudioContextを生成するだけでは、
 * iPad Safariで音声が出るとは限らない。
 *
 * 必ずユーザー操作の中から
 * ensureAudioContext() を呼び出す。
 */
async function ensureAudioContext() {

    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContextClass) {

        throw new Error(
            "Web Audio APIに対応していません。"
        );
    }


    if (!audioContext) {

        audioContext =
            new AudioContextClass();

        masterGain =
            audioContext.createGain();

        masterGain.gain.value =
            masterVolume;

        masterGain.connect(
            audioContext.destination
        );
    }


    /*
     * iOS Safariでは
     * "interrupted" になるケースがある。
     *
     * その場合もresume()を試す。
     */
    if (
        audioContext.state !== "running"
    ) {

        try {

            await audioContext.resume();

        } catch (error) {

            console.warn(
                "AudioContext resume failed:",
                error
            );

            lastAudioError =
                error?.message ||
                String(error);
        }
    }


    /*
     * ここでは「無音AudioBufferを再生する」
     * アンロックを行う。
     *
     * ただし、重要なのは、
     * これをユーザー操作から呼ぶこと。
     */
    if (
        audioContext.state === "running"
    ) {

        try {

            const unlockBuffer =
                audioContext.createBuffer(
                    1,
                    1,
                    audioContext.sampleRate
                );

            const unlockSource =
                audioContext.createBufferSource();

            unlockSource.buffer =
                unlockBuffer;

            unlockSource.connect(
                masterGain
            );

            unlockSource.start(0);

        } catch (error) {

            console.warn(
                "Audio unlock failed:",
                error
            );
        }
    }


    updateDebugPanel();

    return audioContext;
}


/* ============================================================
   LOAD AUDIO
============================================================ */

async function loadAudioBuffer(item) {

    if (
        audioBuffers.has(item.path)
    ) {

        return audioBuffers.get(
            item.path
        );
    }


    /*
     * 日本語ファイル名対策
     */
    const url =
        encodeURI(item.path);


    const response =
        await fetch(
            url,
            {
                method: "GET",
                cache: "force-cache"
            }
        );


    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status}: ${item.path}`
        );
    }


    const arrayBuffer =
        await response.arrayBuffer();


    if (
        !arrayBuffer ||
        arrayBuffer.byteLength === 0
    ) {

        throw new Error(
            `空の音声ファイル: ${item.path}`
        );
    }


    /*
     * SafariではPromise版を使用
     */
    const buffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    if (!buffer) {

        throw new Error(
            `デコード結果が空です: ${item.path}`
        );
    }


    audioBuffers.set(
        item.path,
        buffer
    );


    return buffer;
}


/* ============================================================
   PRELOAD
============================================================ */

async function preloadAllAudios() {

    if (audioEngineInitializing) {
        return;
    }

    audioEngineInitializing = true;

    audioEngineReady = false;


    try {

        await ensureAudioContext();


        const items =
            getAllAudioItems();


        const total =
            items.length;


        let completed = 0;

        const failed = [];


        updatePreparationUI(
            0,
            total,
            "音声ファイルを準備しています..."
        );


        /*
         * iPadのメモリ負荷を抑えるため
         * 1つずつデコード。
         */
        for (
            const item of items
        ) {

            try {

                await loadAudioBuffer(item);

            } catch (error) {

                console.error(
                    "音声ロード失敗:",
                    item.path,
                    error
                );

                failed.push({
                    item,
                    error
                });
            }


            completed++;


            updatePreparationUI(
                completed,
                total,
                `${completed}/${total} ファイル準備中`
            );
        }


        /*
         * 個別ファイルが全てデコードできていれば
         * 音声エンジン準備完了。
         */
        if (
            failed.length === 0 &&
            audioBuffers.size === total
        ) {

            audioEngineReady = true;

            setPreparationSuccess(
                `${total}ファイルの準備が完了しました`
            );

        } else {

            audioEngineReady =
                audioBuffers.size > 0;


            setPreparationError(
                failed
            );
        }


        updateSequenceUI();

        updateDebugPanel();


    } catch (error) {

        console.error(
            "音声エンジン準備エラー:",
            error
        );

        lastAudioError =
            error?.message ||
            String(error);

        audioEngineReady = false;

        setPreparationFatalError(
            lastAudioError
        );

        updateDebugPanel();

    } finally {

        audioEngineInitializing = false;
    }
}

function isItemSelected(

    item
) {

    if (groupType === "cause") {

        return (
            selectedCause?.id === item.id
        );
    }


    if (groupType === "section") {

        return selectedSections.some(
            x => x.id === item.id
        );
    }


    if (groupType === "status") {

        return (
            selectedStatus?.id === item.id
        );
    }


    return false;
}


/* ============================================================
   SELECT
============================================================ */

function handleSelect(
    groupType,
    item
) {

    if (isPlayingQueue) {

        showMessage(
            "再生中は選択を変更できません。",
            "warning"
        );

        return;
    }


    if (groupType === "cause") {

        if (
            selectedCause?.id === item.id
        ) {

            selectedCause = null;

        } else {

            selectedCause = item;
        }
    }


    if (groupType === "section") {

        const index =
            selectedSections.findIndex(
                x => x.id === item.id
            );


        if (index >= 0) {

            selectedSections.splice(
                index,
                1
            );

        } else {

            if (
                selectedSections.length >= 2
            ) {

                selectedSections.shift();
            }

            selectedSections.push(item);
        }
    }


    if (groupType === "status") {

        if (
            selectedStatus?.id === item.id
        ) {

            selectedStatus = null;

        } else {

            selectedStatus = item;
        }
    }


    /*
     * 選択条件が変わったので
     * 古い結合バッファは破棄。
     */
    invalidateCombinedBuffer();


    renderCategoryButtons();

    updateSequenceUI();
}

   QUEUE
============================================================ */

function buildPlayQueue() {

    const queue = [];


    queue.push(
        fixedAudios["1"]
    );


    if (selectedCause) {

        queue.push(
            selectedCause
        );
    }


    queue.push(
        fixedAudios["2"]
    );


    if (selectedSections[0]) {

        queue.push(
            selectedSections[0]
        );
    }


    queue.push(
        fixedAudios["3"]
    );


    if (selectedSections[1]) {

        queue.push(
            selectedSections[1]
        );
    }


    queue.push(
        fixedAudios["4"]
    );


    if (selectedStatus) {

        queue.push(
            selectedStatus
        );
    }


    return queue;
}


function isSelectionComplete() {

    return (
        selectedCause !== null &&
        selectedSections.length === 2 &&
        selectedStatus !== null
    );
}


/* ============================================================
   QUEUE KEY
============================================================ */

function getQueueKey(queue) {

    return queue
        .map(item => item.path)
        .join("||");
}


/* ============================================================
   INVALIDATE COMBINED BUFFER
============================================================ */

function invalidateCombinedBuffer() {

    combinedPlaybackBuffer = null;

    combinedQueueKey = "";

    /*
     * 既に再生していない状態なら
     * 次回再生時に再構築する。
     */
}


/* ============================================================
   BUILD ONE COMBINED AUDIO BUFFER
============================================================ */

/*
 * ここが今回の最重要部分。
 *
 * 以前：
 *
 * 1.MP3 → 再生
 * ↓
 * 原因.MP3 → 再生
 * ↓
 * 2.MP3 → 再生
 * ↓
 * ...
 *
 * ではなく、
 *
 * 1.MP3
 * ＋
 * 原因.MP3
 * ＋
 * 2.MP3
 * ＋
 * ...
 *
 * を1つのAudioBufferにコピーして、
 *
 * 「1個のAudioBufferSourceNode」
 *
 * だけで再生する。
 */
async function buildCombinedPlaybackBuffer(queue) {

    if (!audioContext) {

        throw new Error(
            "AudioContextが初期化されていません。"
        );
    }


    const queueKey =
        getQueueKey(queue);


    if (
        combinedPlaybackBuffer &&
        combinedQueueKey === queueKey
    ) {

        return combinedPlaybackBuffer;
    }


    /*
     * 必要なバッファが存在するか確認
     */
    const buffers = [];


    for (const item of queue) {

        const buffer =
            audioBuffers.get(
                item.path
            );


        if (!buffer) {

            throw new Error(
                `音声バッファがありません: ${item.path}`
            );
        }


        buffers.push(buffer);
    }


    if (buffers.length === 0) {

        throw new Error(
            "再生する音声がありません。"
        );
    }


    /*
     * 最長チャンネル数とサンプルレートを取得。
     */
    let numberOfChannels = 1;

    let sampleRate =
        audioContext.sampleRate;


    let totalDuration = 0;


    for (const buffer of buffers) {

        numberOfChannels =
            Math.max(
                numberOfChannels,
                buffer.numberOfChannels
            );


        /*
         * 通常は同一環境でデコードされるため
         * sampleRateは同じ。
         */
        sampleRate =
            buffer.sampleRate;


        totalDuration +=
            buffer.duration;
    }


    /*
     * 小さな安全マージン。
     *
     * 浮動小数点誤差で最後が切れないようにする。
     */
    const totalLength =
        Math.ceil(
            totalDuration * sampleRate
        ) + 1;


    /*
     * 新しい「1本の音声バッファ」
     */
    const combined =
        audioContext.createBuffer(
            numberOfChannels,
            totalLength,
            sampleRate
        );


    let offset = 0;


    /*
     * 各AudioBufferを順番にコピー。
     */
    for (const sourceBuffer of buffers) {

        const length =
            sourceBuffer.length;


        for (
            let channel = 0;
            channel < numberOfChannels;
            channel++
        ) {

            /*
             * 元音声のチャンネルが1つしかない場合、
             * 全チャンネルに同じ音をコピー。
             */
            const sourceChannel =
                Math.min(
                    channel,
                    sourceBuffer.numberOfChannels - 1
                );


            const sourceData =
                sourceBuffer.getChannelData(
                    sourceChannel
                );


            const targetData =
                combined.getChannelData(
                    channel
                );


            targetData.set(
                sourceData,
                offset
            );
        }


        offset += length;
    }


    combinedPlaybackBuffer =
        combined;

    combinedQueueKey =
        queueKey;


    return combined;
}

============================================================ */

function updateSequenceUI() {

    sequenceDisplay.innerHTML = "";


    const queue =
        buildPlayQueue();


    queue.forEach(
        (item, index) => {

            const fixed =
                Object.values(
                    fixedAudios
                ).includes(item);


            const pill =
                document.createElement("div");


            pill.className =
                fixed

                    ? `flex items-center gap-1.5
                       px-3 py-1.5
                       rounded-xl
                       text-xs font-semibold
                       border
                       bg-slate-800/90
                       border-slate-600
                       text-slate-300`

                    : `flex items-center gap-1.5
                       px-3 py-1.5
                       rounded-xl
                       text-xs font-semibold
                       border
                       bg-indigo-600/30
                       border-indigo-500/50
                       text-indigo-200`;


            pill.innerHTML =
                `<span
                    class="text-[10px]
                           text-slate-500
                           font-mono"
                 >
                    ${index + 1}.
                 </span>

                 <span>
                    ${escapeHtml(item.id)}
                 </span>`;


            sequenceDisplay.appendChild(
                pill
            );
        }
    );


    const ready =
        isSelectionComplete() &&
        audioEngineReady;


    playQueueBtn.disabled =
        !ready ||
        isPlayingQueue;


    if (!isPlayingQueue) {

        if (ready) {

            currentPlayingLabel.textContent =
                "再生準備完了";

        } else if (
            isSelectionComplete()
        ) {

            currentPlayingLabel.textContent =
                "音声準備中...";

        } else {

            currentPlayingLabel.textContent =
                "条件を選択してください";
        }
    }


    queueProgressCount.textContent =
        `0 / ${queue.length}`;
}


/* ============================================================
   STOP SOURCE
============================================================ */

function stopCurrentSource() {

    if (!currentSource) {
        return;
    }


    try {

        currentSource.onended = null;

        currentSource.stop(0);

    } catch (error) {

        /*
         * 既に停止している場合は無視。
         */
    }


    try {

        currentSource.disconnect();

    } catch (error) {}


    currentSource = null;
}


/* ============================================================
   LOOP TIMER
============================================================ */

function clearLoopTimer() {

    if (loopTimerId) {

        clearTimeout(
            loopTimerId
        );

        loopTimerId = null;
    }
}


/* ============================================================
   START PLAYBACK
============================================================ */

async function playQueueSequence() {

    /*
     * ここは必ず「再生ボタンのclick」から
     * 呼び出される。
     *
     * iPad Safari対策として非常に重要。
     */

    if (!isSelectionComplete()) {

        showMessage(
            "原因・区間2つ・状況を選択してください。",
            "warning"
        );

        return;
    }


    if (isPlayingQueue) {
        return;
    }


    /*
     * AudioContextをユーザー操作内で
     * runningにする。
     */
    try {

        await ensureAudioContext();

    } catch (error) {

        lastAudioError =
            error?.message ||
            String(error);

        showMessage(
            "iPadの音声エンジンを起動できませんでした。もう一度再生してください。"
        );

        updateDebugPanel();

        return;
    }


    /*
     * ここで最終確認。
     */
    if (
        !audioContext ||
        audioContext.state !== "running"
    ) {

        showMessage(
            "AudioContextがrunningになっていません。再生ボタンをもう一度押してください。"
        );

        updateDebugPanel();

        return;
    }


    const queue =
        buildPlayQueue();


    /*
     * 選択された音声を
     * 1本のAudioBufferにする。
     *
     * ここが旧方式との最大の違い。
     */
    let combinedBuffer;


    try {

        combinedBuffer =
            await buildCombinedPlaybackBuffer(
                queue
            );

    } catch (error) {

        console.error(
            "結合バッファ生成失敗:",
            error
        );

        lastAudioError =
            error?.message ||
            String(error);

        showMessage(
            `再生用音声の生成に失敗しました: ${lastAudioError}`
        );

        updateDebugPanel();

        return;
    }


    /*
     * 念のためAudioContextをもう一度確認。
     *
     * await後にSafariが状態を変えるケースへの対策。
     */
    if (
        audioContext.state !== "running"
    ) {

        try {

            await audioContext.resume();

        } catch (error) {

            console.warn(
                "2nd resume failed:",
                error
            );
        }
    }


    if (
        audioContext.state !== "running"
    ) {

        showMessage(
            "音声出力を開始できませんでした。再生ボタンをもう一度押してください。"
        );

        updateDebugPanel();

        return;
    }


    /*
     * 以前の再生を完全停止。
     */
    stopCurrentSource();

    clearLoopTimer();


    playbackSessionId++;

    const session =
        playbackSessionId;


    isPlayingQueue = true;


    currentPlaybackDuration =
        combinedBuffer.duration;


    /*
     * UI
     */
    playQueueBtn.disabled = true;

    stopQueueBtn.disabled = false;


    playQueueIcon.className =
        "fa-solid fa-spinner play-spin text-xl";


    setStatus(
        "再生中",
        "emerald"
    );


    currentPlayingLabel.textContent =
        "音声を再生しています...";


    queueProgressCount.textContent =
        `${queue.length} 個の音声を連結済み`;


    queueProgressBar.style.width =
        "0%";


    /*
     * ========================================================
     * 1つだけAudioBufferSourceNodeを作る
     * ========================================================
     */
    const source =
        audioContext.createBufferSource();


    source.buffer =
        combinedBuffer;


    source.connect(
        masterGain
    );


    currentSource =
        source;


    currentSourceStartTime =
        audioContext.currentTime;


    /*
     * 終了処理
     */
    source.onended =
        function() {

            if (
                session !== playbackSessionId
            ) {

                return;
            }


            if (
                currentSource === source
            ) {

                currentSource = null;
            }


            handlePlaybackFinished(
                session
            );
        };


    /*
     * ========================================================
     * 最重要：
     * start()をAudioContextがrunningの状態で実行。
     * ========================================================
     */
    try {

        source.start(0);

    } catch (error) {

        console.error(
            "source.start failed:",
            error
        );

        lastAudioError =
            error?.message ||
            String(error);


        try {
            source.disconnect();
        } catch (_) {}


        currentSource = null;

        isPlayingQueue = false;

        playQueueIcon.className =
            "fa-solid fa-play text-xl";

        stopQueueBtn.disabled = true;

        playQueueBtn.disabled = false;


        setStatus(
            "再生エラー",
            "rose"
        );


        showMessage(
            `音声再生開始に失敗しました: ${lastAudioError}`
        );


        updateDebugPanel();

        return;
    }


    /*
     * 進捗表示
     */
    updateCombinedProgress(
        session
    );


    updateDebugPanel();
}


/* ============================================================
   PROGRESS
============================================================ */

function updateCombinedProgress(
    session
) {

    if (
        !isPlayingQueue ||
        session !== playbackSessionId ||
        !audioContext ||
        !combinedPlaybackBuffer
    ) {

        return;
    }


    const elapsed =
        audioContext.currentTime -
        currentSourceStartTime;


    const progress =
        Math.min(
            Math.max(
                elapsed /
                combinedPlaybackBuffer.duration,
                0
            ),
            1
        );


    queueProgressBar.style.width =
        `${progress * 100}%`;


    currentPlayingLabel.textContent =
        `再生中 ${Math.floor(progress * 100)}%`;


    requestAnimationFrame(
        () => {

            updateCombinedProgress(
                session
            );

        }
    );
}


/* ============================================================
   PLAYBACK FINISHED
============================================================ */

function handlePlaybackFinished(
    session
) {

    if (
        session !== playbackSessionId
    ) {

        return;
    }


    isPlayingQueue = false;


    currentSource = null;


    queueProgressBar.style.width =
        "100%";


    const queue =
        buildPlayQueue();


    queueProgressCount.textContent =
        `${queue.length} / ${queue.length}`;


    playQueueIcon.className =
        "fa-solid fa-play text-xl";


    stopQueueBtn.disabled = true;


    if (isLoopEnabled) {

        setStatus(
            "ループ待機中",
            "amber"
        );


        startLoopTimer();

    } else {

        setStatus(
            "完了",
            "indigo"
        );


        currentPlayingLabel.textContent =
            "再生完了";


        playQueueBtn.disabled =
            !(
                isSelectionComplete() &&
                audioEngineReady
            );
    }


    updateDebugPanel();
}


/* ============================================================
   LOOP
============================================================ */

function startLoopTimer() {

    clearLoopTimer();


    const seconds =
        Math.max(
            0,
            Number(loopIntervalSeconds) || 0
        );


    if (seconds <= 0) {

        restartPlayback();

        return;
    }


    let remaining =
        seconds;


    currentPlayingLabel.textContent =
        `ループ待機中（${remaining}秒）`;


    loopTimerId =
        setInterval(
            () => {

                remaining--;


                if (remaining <= 0) {

                    clearLoopTimer();

                    restartPlayback();

                } else {

                    currentPlayingLabel.textContent =
                        `ループ待機中（${remaining}秒）`;
                }

            },
            1000
        );
}


function clearLoopTimer() {

    if (loopTimerId) {

        clearInterval(
            loopTimerId
        );

        loopTimerId = null;
    }
}


async function restartPlayback() {

    if (
        !isSelectionComplete()
    ) {

        stopQueue();

        return;
    }


    /*
     * ループ再生はユーザー操作ではないので
     * 「新しいAudioContextのunlock」は期待しない。
     *
     * 既にユーザー操作でAudioContextをrunningに
     * していることを前提にする。
     */
    if (
        !audioContext ||
        audioContext.state !== "running"
    ) {

        try {

            await audioContext.resume();

        } catch (error) {

            console.warn(
                "Loop resume failed:",
                error
            );
        }
    }


    if (
        !audioContext ||
        audioContext.state !== "running"
    ) {

        isPlayingQueue = false;

        setStatus(
            "音声停止",
            "amber"
        );

        currentPlayingLabel.textContent =
            "音声エンジンが停止しました。再生ボタンを押してください。";

        return;
    }


    /*
     * 自動ループなので
     * playQueueSequence()の
     * 「ユーザー操作必須部分」は通さない。
     */
    await playCombinedBufferDirect();
}


/* ============================================================
   DIRECT COMBINED BUFFER PLAY
============================================================ */

async function playCombinedBufferDirect() {

    const queue =
        buildPlayQueue();


    if (!combinedPlaybackBuffer) {

        try {

            combinedPlaybackBuffer =
                await buildCombinedPlaybackBuffer(
                    queue
                );

        } catch (error) {

            showMessage(
                "ループ用音声を準備できませんでした。"
            );

            return;
        }
    }


    stopCurrentSource();


    playbackSessionId++;

    const session =
        playbackSessionId;


    isPlayingQueue = true;


    const source =
        audioContext.createBufferSource();


    source.buffer =
        combinedPlaybackBuffer;


    source.connect(
        masterGain
    );


    currentSource =
        source;


    currentSourceStartTime =
        audioContext.currentTime;


    currentPlaybackDuration =
        combinedPlaybackBuffer.duration;


    playQueueBtn.disabled = true;

    stopQueueBtn.disabled = false;


    playQueueIcon.className =
        "fa-solid fa-spinner play-spin text-xl";


    setStatus(
        "再生中",
        "emerald"
    );


    source.onended =
        function() {

            if (
                session !== playbackSessionId
            ) {

                return;
            }


            currentSource = null;


            handlePlaybackFinished(
                session
            );
        };


    try {

        source.start(0);

    } catch (error) {

        console.error(
            "loop source.start failed:",
            error
        );

        currentSource = null;

        isPlayingQueue = false;

        showMessage(
            "ループ再生を開始できませんでした。"
        );
    }


    updateCombinedProgress(
        session
    );
}


/* ============================================================
   STOP
============================================================ */

function stopQueue() {

    playbackSessionId++;


    isPlayingQueue = false;


    clearLoopTimer();


    stopCurrentSource();


    playQueueIcon.className =
        "fa-solid fa-play text-xl";


    stopQueueBtn.disabled = true;


    playQueueBtn.disabled =
        !(
            isSelectionComplete() &&
            audioEngineReady
        );


    queueProgressBar.style.width =
        "0%";


    const queue =
        buildPlayQueue();


    queueProgressCount.textContent =
        `0 / ${queue.length}`;


    currentPlayingLabel.textContent =
        "再生停止";


    setStatus(
        "準備完了",
        "indigo"
    );


    updateDebugPanel();
}


/* ============================================================
   PLAY BUTTON
============================================================ */

playQueueBtn.addEventListener(
    "click",
    function() {

        /*
         * async関数をクリックから直接呼ぶ。
         *
         * ここがiPad Safariの
         * ユーザー操作コンテキスト。
         */
        playQueueSequence();

    }
);


/* ============================================================
   STOP BUTTON
============================================================ */

stopQueueBtn.addEventListener(
    "click",
    function() {

        stopQueue();

    }
);


/* ============================================================
   RESET
============================================================ */

resetSelectionBtn.addEventListener(
    "click",
    function() {

        if (isPlayingQueue) {

            stopQueue();
        }


        selectedCause = null;

        selectedSections = [];

        selectedStatus = null;


        invalidateCombinedBuffer();


        renderCategoryButtons();

        updateSequenceUI();
    }
);


/* ============================================================
   VOLUME
============================================================ */

masterVolumeInput.addEventListener(
    "input",
    function(event) {

        masterVolume =
            Number(
                event.target.value
            );


        if (
            masterGain &&
            audioContext
        ) {

            try {

                masterGain.gain.setTargetAtTime(
                    masterVolume,
                    audioContext.currentTime,
                    0.01
                );

            } catch (error) {

                masterGain.gain.value =
                    masterVolume;
            }
        }


        masterVolumeVal.textContent =
            `${Math.round(masterVolume * 100)}%`;


        if (
            masterVolume <= 0
        ) {

            volumeIcon.className =
                "fa-solid fa-volume-xmark text-slate-400 text-sm";

        } else if (
            masterVolume < 0.5
        ) {

            volumeIcon.className =
                "fa-solid fa-volume-low text-slate-400 text-sm";

        } else {

            volumeIcon.className =
                "fa-solid fa-volume-high text-slate-400 text-sm";
        }
    }
);


/* ============================================================
   LOOP UI
============================================================ */

loopEnableToggle.addEventListener(
    "change",
    function(event) {

        isLoopEnabled =
            event.target.checked;


        if (isLoopEnabled) {

            loopSettingsArea.classList.remove(
                "opacity-40",
                "pointer-events-none"
            );

        } else {

            loopSettingsArea.classList.add(
                "opacity-40",
                "pointer-events-none"
            );


            clearLoopTimer();
        }
    }
);


loopIntervalRange.addEventListener(
    "input",
    function(event) {

        let value =
            Number(
                event.target.value
            );


        if (!Number.isFinite(value)) {
            value = 10;
        }


        value =
            Math.max(
                0,
                Math.min(
                    300,
                    value
                )
            );


        loopIntervalSeconds =
            value;


        loopIntervalInput.value =
            value;
    }
);


loopIntervalInput.addEventListener(
    "change",
    function(event) {

        let value =
            Number(
                event.target.value
            );


        if (!Number.isFinite(value)) {
            value = 10;
        }


        value =
            Math.max(
                0,
                Math.min(
                    300,
                    value
                )
            );


        loopIntervalSeconds =
            value;


        loopIntervalInput.value =
            value;

        loopIntervalRange.value =
            value;
    }
);


/* ============================================================
   LOGIN
============================================================ */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        if (
            username !== AUTH_CONFIG.username ||
            password !== AUTH_CONFIG.password
        ) {

            loginError.classList.remove(
                "hidden"
            );

            return;
        }


        loginError.classList.add(
            "hidden"
        );


        /*
         * ログインボタン自体が
         * iPad Safariのユーザー操作。
         *
         * ここでAudioContextを生成・resumeする。
         */
        try {

            await ensureAudioContext();

        } catch (error) {

            console.warn(
                "Login audio initialization:",
                error
            );
        }


        loginScreen.classList.add(
            "hidden"
        );


        mainSystem.classList.remove(
            "hidden-force"
        );


        setStatus(
            "音声準備中",
            "indigo"
        );


        /*
         * 少しだけUI描画を返してから
         * 大量のデコードを開始。
         */
        setTimeout(
            () => {

                preloadAllAudios();

            },
            50
        );
    }
);


/* ============================================================
   LOGOUT
============================================================ */

logoutButton.addEventListener(
    "click",
    function() {

        stopQueue();


        mainSystem.classList.add(
            "hidden-force"
        );


        loginScreen.classList.remove(
            "hidden"
        );


        document
            .getElementById("username")
            .value = "";


        document
            .getElementById("password")
            .value = "";
    }
);


/* ============================================================
   PAGE VISIBILITY
============================================================ */

document.addEventListener(
    "visibilitychange",
    async function() {

        if (
            document.visibilityState !==
            "visible"
        ) {

            return;
        }


        if (!audioContext) {
            return;
        }


        /*
         * iOS Safariから戻ってきたとき
         * suspended / interrupted になる可能性がある。
         */
        if (
            audioContext.state !== "running"
        ) {

            try {

                await audioContext.resume();

            } catch (error) {

                console.warn(
                    "visibility resume:",
                    error
                );
            }
        }


        updateDebugPanel();
    }
);


/* ============================================================
   PAGE SHOW
============================================================ */

window.addEventListener(
    "pageshow",
    async function() {

        if (!audioContext) {
            return;
        }


        if (
            audioContext.state !== "running"
        ) {

            try {

                await audioContext.resume();

            } catch (error) {

                console.warn(
                    "pageshow resume:",
                    error
                );
            }
        }


        updateDebugPanel();
    }
);


/* ============================================================
   AUDIO CONTEXT STATE CHANGE
============================================================ */

/*
 * AudioContextの状態変化を監視。
 *
 * iPad Safariで
 *
 * running
 * → interrupted
 * → suspended
 *
 * のような変化が起きた場合に
 * デバッグ画面へ反映する。
 */
function installAudioContextMonitoring() {

    if (!audioContext) {
        return;
    }


    audioContext.onstatechange =
        function() {

            console.log(
                "AudioContext state:",
                audioContext.state
            );


            updateDebugPanel();
        };
}


/*
 * ensureAudioContextの補助として、
 * Context生成後にmonitorを設定する。
 */
const originalEnsureAudioContext =
    ensureAudioContext;


/*
 * 関数をラップ。
 */
ensureAudioContext =
    async function() {

        const result =
            await originalEnsureAudioContext();


        installAudioContextMonitoring();


        updateDebugPanel();


        return result;
    };


/* ============================================================
   DEBUG
============================================================ */

function updateDebugPanel() {

    if (!debugPanel) {
        return;
    }


    const contextState =
        audioContext
            ? audioContext.state
            : "未作成";


    const sampleRate =
        audioContext
            ? audioContext.sampleRate
            : "-";


    const buffers =
        audioBuffers.size;


    const combined =
        combinedPlaybackBuffer
            ? `${combinedPlaybackBuffer.duration.toFixed(2)}秒`
            : "未生成";


    const source =
        currentSource
            ? "あり"
            : "なし";


    let contextClass =
        "debug-warning";


    if (
        contextState === "running"
    ) {

        contextClass =
            "debug-ok";

    } else if (
        contextState === "suspended" ||
        contextState === "interrupted"
    ) {

        contextClass =
            "debug-warning";

    } else {

        contextClass =
            "debug-error";
    }


    debugPanel.innerHTML =

        `AudioContext:
         <span class="${contextClass}">
            ${escapeHtml(contextState)}
         </span>
         <br>

         AudioBuffer:
         ${buffers}個
         <br>

         結合再生バッファ:
         ${combined}
         <br>

         AudioBufferSource:
         ${source}
         <br>

         SampleRate:
         ${sampleRate}
         <br>

         音量:
         ${Math.round(masterVolume * 100)}%
         <br>

         再生状態:
         ${isPlayingQueue ? "再生中" : "停止"}
         <br>

         エラー:
         ${escapeHtml(lastAudioError || "なし")}`;
}


refreshDebugBtn.addEventListener(
    "click",
    function() {

        updateDebugPanel();

    }
);


/* ============================================================
   GLOBAL DEBUG API
============================================================ */

window.audioSystemDebug = {

    getContextState() {

        return audioContext
            ? audioContext.state
            : "not-created";
    },


    getBufferCount() {

        return audioBuffers.size;
    },


    getBufferPaths() {

        return Array.from(
            audioBuffers.keys()
        );
    },


    getCombinedBufferDuration() {

        return combinedPlaybackBuffer
            ? combinedPlaybackBuffer.duration
            : 0;
    },


    getMasterVolume() {

        return masterVolume;
    },


    isReady() {

        return audioEngineReady;
    },


    isPlaying() {

        return isPlayingQueue;
    },


    getLastError() {

        return lastAudioError;
    },


    async resume() {

        if (!audioContext) {

            return "AudioContext not created";
        }


        await audioContext.resume();

        updateDebugPanel();

        return audioContext.state;
    }
};


/* ============================================================
   INITIALIZE
============================================================ */

window.addEventListener(
    "load",
    function() {

        renderCategoryButtons();

        updateSequenceUI();

        updateDebugPanel();

        setStatus(
            "ログインしてください",
            "indigo"
        );
    }
);

</script>
