/* ============================================================
   AudioContext生成
============================================================ */

function createAudioContext() {

    if (audioContext) {
        return audioContext;
    }

    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContextClass) {

        throw new Error(
            'このブラウザはWeb Audio APIに対応していません。'
        );
    }

    audioContext =
        new AudioContextClass();

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        masterVolume;

    masterGain.connect(
        audioContext.destination
    );

    updateAudioDebug();

    return audioContext;
}


/* ============================================================
   AudioContext状態表示
============================================================ */

function updateAudioDebug() {

    if (!audioContext) {

        audioDebug.textContent =
            'AudioContext: 未作成';

        return;
    }

    audioDebug.textContent =
        `AudioContext: ${audioContext.state}`;
}


/* ============================================================
   iPad / iPhone用AudioContextアンロック
============================================================ */

async function unlockAudioContext() {

    const ctx =
        createAudioContext();

    /*
     * 重要:
     *
     * この関数は必ず
     * 「再生ボタンのクリック」
     * から呼び出す。
     */

    if (ctx.state !== 'running') {

        try {

            await ctx.resume();

        } catch (error) {

            console.error(
                'AudioContext.resume失敗:',
                error
            );
        }
    }

    /*
     * iOS Safari対策。
     *
     * 極小の無音Bufferを一度再生することで
     * オーディオ出力経路を初期化する。
     */

    try {

        const buffer =
            ctx.createBuffer(
                1,
                1,
                ctx.sampleRate
            );

        const source =
            ctx.createBufferSource();

        source.buffer = buffer;

        const gain =
            ctx.createGain();

        gain.gain.value = 0.00001;

        source.connect(gain);
        gain.connect(ctx.destination);

        source.start(0);

    } catch (error) {

        console.warn(
            'AudioContext unlock用再生失敗:',
            error
        );
    }

    /*
     * iOSではresume()後も状態確認を行う。
     */

    await new Promise(resolve =>
        setTimeout(resolve, 50)
    );

    updateAudioDebug();

    if (ctx.state !== 'running') {

        throw new Error(
            `AudioContextを開始できませんでした。現在の状態: ${ctx.state}`
        );
    }

    audioContextUnlocked = true;

    return true;
}


/* ============================================================
   URL生成
============================================================ */

function getAudioURL(path) {

    /*
     * 日本語ファイル名でも安全に扱えるよう
     * URLとして正規化する。
     */

    return new URL(
        path,
        window.location.href
    ).href;
}


/* ============================================================
   ArrayBuffer取得
============================================================ */

async function fetchAudioFile(path) {

    const url =
        getAudioURL(path);

    const response =
        await fetch(
            url,
            {
                cache: 'force-cache'
            }
        );

    if (!response.ok) {

        throw new Error(
            `音声ファイル取得失敗: ${response.status} ${url}`
        );
    }

    return await response.arrayBuffer();
}


/* ============================================================
   MP3 → AudioBuffer
============================================================ */

async function decodeAudioFile(path) {

    const ctx =
        createAudioContext();

    const arrayBuffer =
        await fetchAudioFile(path);

    /*
     * decodeAudioDataは元のArrayBufferを
     * 直接再利用できない場合があるため、
     * 必要ならsliceする。
     */

    const decoded =
        await ctx.decodeAudioData(
            arrayBuffer.slice(0)
        );

    return decoded;
}


/* ============================================================
   キュー作成
============================================================ */

function buildPlayQueue() {

    const queue = [];

    queue.push(fixedAudios['1']);

    if (selectedCause) {
        queue.push(selectedCause);
    }

    queue.push(fixedAudios['2']);

    if (selectedSections[0]) {
        queue.push(selectedSections[0]);
    }

    queue.push(fixedAudios['3']);

    if (selectedSections[1]) {
        queue.push(selectedSections[1]);
    }

    queue.push(fixedAudios['4']);

    if (selectedStatus) {
        queue.push(selectedStatus);
    }

    return queue;
}


/* ============================================================
   選択完了確認
============================================================ */

function isSelectionComplete() {

    return (
        selectedCause !== null &&
        selectedSections.length === 2 &&
        selectedStatus !== null
    );
}


/* ============================================================
   複数AudioBufferを1本に結合
============================================================ */

function concatenateAudioBuffers(buffers) {

    if (!buffers.length) {

        throw new Error(
            '結合する音声がありません。'
        );
    }

    const ctx =
        createAudioContext();

    /*
     * 全Bufferの最大チャンネル数を採用
     */

    let numberOfChannels = 1;

    let totalLength = 0;

    buffers.forEach(buffer => {

        numberOfChannels =
            Math.max(
                numberOfChannels,
                buffer.numberOfChannels
            );

        totalLength +=
            buffer.length;
    });


    /*
     * Web AudioのsampleRateは
     * 基本的にAudioContextのsampleRateに揃う。
     */

    const output =
        ctx.createBuffer(
            numberOfChannels,
            totalLength,
            ctx.sampleRate
        );


    let offset = 0;


    for (const buffer of buffers) {

        for (
            let channel = 0;
            channel < numberOfChannels;
            channel++
        ) {

            const destination =
                output.getChannelData(channel);

            /*
             * 入力側がモノラルの場合、
             * 両チャンネルへコピーする。
             */

            const sourceChannel =
                Math.min(
                    channel,
                    buffer.numberOfChannels - 1
                );

            const source =
                buffer.getChannelData(
                    sourceChannel
                );

            destination.set(
                source,
                offset
            );
        }

        offset += buffer.length;
    }

    return output;
}


/* ============================================================
   音声を事前デコードして1本にする
============================================================ */

async function prepareCombinedAudio() {

    const queue =
        buildPlayQueue();

    if (!queue.length) {

        throw new Error(
            '再生する音声がありません。'
        );
    }

    audioPreparationBox.classList.remove(
        'hidden'
    );

    prepareIcon.className =
        'fa-solid fa-spinner fa-spin text-indigo-400';

    prepareTitle.textContent =
        '音声を準備しています';

    prepareText.textContent =
        'iPad用に音声をメモリへ展開しています';

    prepareProgress.style.width =
        '0%';


    const buffers = [];

    for (
        let i = 0;
        i < queue.length;
        i++
    ) {

        const item =
            queue[i];

        prepareText.textContent =
            `${i + 1} / ${queue.length} : ${item.id}`;

        prepareProgress.style.width =
            `${((i) / queue.length) * 100}%`;


        const decoded =
            await decodeAudioFile(
                item.path
            );

        buffers.push(decoded);

        prepareProgress.style.width =
            `${((i + 1) / queue.length) * 100}%`;
    }


    /*
     * ここで全音声を1本に結合
     */

    combinedBuffer =
        concatenateAudioBuffers(
            buffers
        );


    prepareIcon.className =
        'fa-solid fa-check text-emerald-400';

    prepareTitle.textContent =
        '音声の準備が完了しました';

    prepareText.textContent =
        `${queue.length}個の音声を1本のAudioBufferに結合しました`;


    /*
     * 少し表示してから消す
     */

    setTimeout(() => {

        audioPreparationBox.classList.add(
            'hidden'
        );

    }, 800);


    return combinedBuffer;
}


/* ============================================================
   カテゴリボタン

function renderCategoryButtons() {

function renderGroup(
    items,
    container,
    groupType
) {

    container.innerHTML = '';

    items.forEach(item => {

        const button =
            document.createElement('button');

        const selected =
            isItemSelected(

            );


        button.className =

             font-bold transition-all
             active:scale-95 ${
                selected
                    ? `bg-gradient-to-tr
                       ${item.color}
                       border-white
                       text-white
                       shadow-lg

                       ring-indigo-400`
                    : `bg-slate-800/80
                       border-slate-700/60
                       text-slate-300

             }`;

            <div class="text-xs sm:text-sm

            </div>
        `;

/* ============================================================
   選択判定
============================================================ */

function isItemSelected(
    groupType,
    item
) {

    if (groupType === 'cause') {

        return selectedCause?.id === item.id;
    }

    if (groupType === 'section') {

        return selectedSections.some(
            s => s.id === item.id
        );
    }

    if (groupType === 'status') {

        return selectedStatus?.id === item.id;
    }

    return false;
}


/* ============================================================
   選択処理
============================================================ */

function handleSelect(
    groupType,
    item
) {

    if (isPlayingQueue) {

        showMessage(
            '再生中は選択を変更できません。'
        );

        return;
    }


    /*
     * 新しい選択をしたら
     * 古い結合Bufferは破棄する。
     */

    combinedBuffer = null;


    if (groupType === 'cause') {

        selectedCause =
            selectedCause?.id === item.id
                ? null
                : item;

    }


    else if (groupType === 'section') {

        const index =
            selectedSections.findIndex(
                s => s.id === item.id
            );


        if (index >= 0) {

            selectedSections.splice(
                index,
                1
            );

        } else {

            if (
                selectedSections.length >= 2
            ) {

                selectedSections.shift();
            }

            selectedSections.push(item);
        }
    }


    else if (groupType === 'status') {

        selectedStatus =
            selectedStatus?.id === item.id
                ? null
                : item;
    }


    renderCategoryButtons();

    updateSequenceUI();
}


/* ============================================================
   シーケンス表示
============================================================ */

function updateSequenceUI() {

    sequenceDisplay.innerHTML = '';

    const queue =
        buildPlayQueue();


    queue.forEach(
        (item, index) => {

                Object.values(fixedAudios)

                    );

}


/* ============================================================
   再生進捗
============================================================ */

function startProgressTimer(
    token
) {

    stopProgressTimer();


    progressTimer =
        setInterval(
            () => {

                if (
                    !isPlayingQueue ||
                    token !== playbackToken ||
                    !audioContext
                ) {

                    return;
                }


                const elapsed =
                    audioContext.currentTime -
                    currentPlaybackStartedAt;


                if (
                    currentPlaybackDuration <= 0
                ) {

                    return;
                }


                const progress =
                    Math.min(
                        1,
                        elapsed /
                        currentPlaybackDuration
                    );


                queueProgressBar.style.width =
                    `${progress * 100}%`;


                if (progress >= 1) {

                    stopProgressTimer();
                }

            },
            50
        );
}


function stopProgressTimer() {

    if (progressTimer) {

        clearInterval(
            progressTimer
        );

        progressTimer = null;
    }
}


/* ============================================================
   1本のAudioBufferを再生
============================================================ */

async function playCombinedBuffer() {

    if (!combinedBuffer) {

        throw new Error(
            '結合済みAudioBufferがありません。'
        );
    }


    const ctx =
        createAudioContext();


    /*
     * iPadでAudioContextが
     * suspended / interruptedの場合に復帰。
     */

    if (ctx.state !== 'running') {

        await ctx.resume();

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    50
                )
        );
    }


    updateAudioDebug();


    if (ctx.state !== 'running') {

        throw new Error(
            `AudioContextがrunningになりません。状態: ${ctx.state}`
        );
    }


    /*
     * 以前のSourceを停止
     */

    if (currentSource) {

        try {

            currentSource.stop();

        } catch (e) {}

        currentSource.disconnect();

        currentSource = null;
    }


    /*
     * 新しいSource
     */

    const source =
        ctx.createBufferSource();


    source.buffer =
        combinedBuffer;


    /*
     * 音量
     */

    masterGain.gain.setValueAtTime(
        masterVolume,
        ctx.currentTime
    );


    source.connect(
        masterGain
    );


    currentSource =
        source;


    const token =
        playbackToken;


    currentPlaybackStartedAt =
        ctx.currentTime;


    currentPlaybackDuration =
        combinedBuffer.duration;


    /*
     * 終了イベント
     */

    source.onended =
        () => {

            if (
                token !== playbackToken
            ) {

                return;
            }


            if (!isPlayingQueue) {

                return;
            }


            currentSource = null;

            stopProgressTimer();

            handleQueueFinished();
        };


    /*
     * ここが実際の再生開始
     */

    source.start(
        0
    );


    startProgressTimer(
        token
    );
}


/* ============================================================
   キュー終了
============================================================ */

function handleQueueFinished() {

    if (!isPlayingQueue) {

        return;
    }


    queueProgressBar.style.width =
        '100%';


    const queue =
        buildPlayQueue();


    queueProgressCount.textContent =
        `${queue.length} / ${queue.length}`;


    if (isLoopEnabled) {

        startLoopWait();

    } else {

        finishQueue();
    }
}


/* ============================================================
   再生開始
============================================================ */

async function startPlayback() {

    if (isPlayingQueue) {

        return;
    }


    if (!isSelectionComplete()) {

        showMessage(
            '原因・区間2つ・状況を選択してください。'
        );

        return;
    }


    const token =
        ++playbackToken;


    try {

        /*
         * ==================================================
         * 最重要
         *
         * クリックイベントから直接
         * AudioContextをresumeする。
         * ==================================================
         */

        await unlockAudioContext();


        isPlayingQueue = true;

        playQueueBtn.disabled = true;

        stopQueueBtn.disabled = false;

        playQueueIcon.className =
            'fa-solid fa-spinner fa-spin text-xl';


        statusBadge.className =
            'px-3 py-1 rounded-full
             text-xs font-medium
             bg-indigo-500/10
             text-indigo-400
             border border-indigo-500/20
             flex items-center gap-1.5';


        statusBadge.innerHTML =
            `<span class="w-2 h-2
                          rounded-full
                          bg-indigo-400
                          animate-pulse"></span>
             音声準備中`;


        /*
         * まだBufferがなければ作る
         */

        if (!combinedBuffer) {

            await prepareCombinedAudio();
        }


        /*
         * Stopされた場合
         */

        if (
            !isPlayingQueue ||
            token !== playbackToken
        ) {

            return;
        }


        statusBadge.className =
            'px-3 py-1 rounded-full
             text-xs font-medium
             bg-emerald-500/10
             text-emerald-400
             border border-emerald-500/20
             flex items-center gap-1.5';


        statusBadge.innerHTML =
            `<span class="w-2 h-2
                          rounded-full
                          bg-emerald-400
                          animate-pulse"></span>
             再生中`;


        playQueueIcon.className =
            'fa-solid fa-volume-high text-xl';


        currentPlayingLabel.textContent =
            `再生中（${buildPlayQueue().length}音声を連続再生）`;


        queueProgressCount.textContent =
            `1 / ${buildPlayQueue().length}`;


        queueProgressBar.style.width =
            '0%';


        /*
         * 1本のAudioBufferを再生
         */

        await playCombinedBuffer();


    } catch (error) {

        console.error(
            '再生開始エラー:',
            error
        );


        stopQueue();


        showMessage(
            `音声再生に失敗しました: ${error.message}`
        );
    }
}


/* ============================================================
   再生完了
============================================================ */

function finishQueue() {

    isPlayingQueue = false;

    stopProgressTimer();

    clearLoopTimers();


    if (currentSource) {

        try {

            currentSource.disconnect();

        } catch (e) {}

        currentSource = null;
    }


    playQueueIcon.className =
        'fa-solid fa-play text-xl';


    stopQueueBtn.disabled =
        true;


    playQueueBtn.disabled =
        !isSelectionComplete();


    currentPlayingLabel.textContent =
        '再生完了！';


    queueProgressBar.style.width =
        '100%';


    const queue =
        buildPlayQueue();


    queueProgressCount.textContent =
        `${queue.length} / ${queue.length}`;


    statusBadge.className =
        'px-3 py-1 rounded-full
         text-xs font-medium
         bg-indigo-500/10
         text-indigo-400
         border border-indigo-500/20
         flex items-center gap-1.5';


    statusBadge.innerHTML =
        `<span class="w-2 h-2
                      rounded-full
                      bg-indigo-400"></span>
         完了`;
}


/* ============================================================
   ループ待機
============================================================ */

function startLoopWait() {

    if (!isPlayingQueue) {

        return;
    }


    clearLoopTimers();


    remainingCountdown =
        loopIntervalSeconds;


    statusBadge.className =
        'px-3 py-1 rounded-full
         text-xs font-medium
         bg-amber-500/10
         text-amber-400
         border border-amber-500/20
         flex items-center gap-1.5';


    statusBadge.innerHTML =
        `<span class="w-2 h-2
                      rounded-full
                      bg-amber-400
                      animate-pulse"></span>
         ループ待機中`;


    if (remainingCountdown <= 0) {

        restartQueue();

        return;
    }


    updateCountdownLabel();


    countdownTimerId =
        setInterval(
            () => {

                if (!isPlayingQueue) {

                    clearLoopTimers();

                    return;
                }


                remainingCountdown--;


                if (
                    remainingCountdown <= 0
                ) {

                    clearLoopTimers();

                    restartQueue();

                } else {

                    updateCountdownLabel();
                }

            },
            1000
        );
}


/* ============================================================
   ループ再開
============================================================ */

async function restartQueue() {

    if (!isPlayingQueue) {

        return;
    }


    clearLoopTimers();


    queueProgressBar.style.width =
        '0%';


    playbackToken++;


    try {

        const ctx =
            createAudioContext();


        /*
         * iPadで復帰時にcontextが
         * suspended / interruptedになっている
         * 場合への対策。
         */

        if (ctx.state !== 'running') {

            await ctx.resume();
        }


        currentPlayingLabel.textContent =
            `再生中（${buildPlayQueue().length}音声を連続再生）`;


        statusBadge.className =
            'px-3 py-1 rounded-full
             text-xs font-medium
             bg-emerald-500/10
             text-emerald-400
             border border-emerald-500/20
             flex items-center gap-1.5';


        statusBadge.innerHTML =
            `<span class="w-2 h-2
                          rounded-full
                          bg-emerald-400
                          animate-pulse"></span>
             再生中`;


        playbackToken++;

        await playCombinedBuffer();

    } catch (error) {

        console.error(
            'ループ再生エラー:',
            error
        );

        showMessage(
            'ループ再生を再開できませんでした。'
        );
    }
}


/* ============================================================
   カウントダウン
============================================================ */

function updateCountdownLabel() {

    currentPlayingLabel.textContent =
        `ループ再生待機中（${remainingCountdown}秒後に再生）`;
}


/* ============================================================
   タイマー解除
============================================================ */

function clearLoopTimers() {

    if (loopTimerId) {

        clearTimeout(
            loopTimerId
        );

        loopTimerId = null;
    }


    if (countdownTimerId) {

        clearInterval(
            countdownTimerId
        );

        countdownTimerId = null;
    }
}


/* ============================================================
   停止
============================================================ */

function stopQueue() {

    playbackToken++;


    isPlayingQueue = false;


    stopProgressTimer();

    clearLoopTimers();


    if (currentSource) {

        try {

            currentSource.stop();

        } catch (e) {}

        try {

            currentSource.disconnect();

        } catch (e) {}

        currentSource = null;
    }


    playQueueIcon.className =
        'fa-solid fa-play text-xl';


    stopQueueBtn.disabled =
        true;


    playQueueBtn.disabled =
        !isSelectionComplete();


    currentPlayingLabel.textContent =
        '再生停止';


    statusBadge.className =
        'px-3 py-1 rounded-full
         text-xs font-medium
         bg-indigo-500/10
         text-indigo-400
         border border-indigo-500/20
         flex items-center gap-1.5';


    statusBadge.innerHTML =
        `<span class="w-2 h-2
                      rounded-full
                      bg-indigo-400"></span>
         準備完了`;
}

            'hidden'
        );


        loginScreen.classList.remove(
            'hidden'
        );


        username.value = '';

        password.value = '';
    }
);


/* ============================================================
   iPad Safari 復帰対策
============================================================ */

document.addEventListener(
    'visibilitychange',
    async () => {

        updateAudioDebug();


        if (
            document.visibilityState !==
            'visible'
        ) {

            return;
        }


        /*
         * Safari / iOSでバックグラウンドから
         * 復帰した場合。
         */

        if (
            audioContext &&
            isPlayingQueue
        ) {

            try {

                if (
                    audioContext.state !==
                    'running'
                ) {

                    await audioContext.resume();
                }


                /*
                 * 一部iOSでは
                 * stateがrunningでも
                 * 音が復帰しないケースがある。
                 *
                 * その場合は現在の再生を
                 * いったん再生成する。
                 */

                updateAudioDebug();

            } catch (error) {

                console.warn(
                    'AudioContext復帰失敗:',
                    error
                );
            }
        }
    }
);


/* ============================================================
   pageshow
============================================================ */

window.addEventListener(
    'pageshow',
    async () => {

        updateAudioDebug();


        if (
            audioContext &&
            isPlayingQueue
        ) {

            try {

                if (
                    audioContext.state !==
                    'running'
                ) {

                    await audioContext.resume();
                }

            } catch (error) {

                console.warn(
                    'pageshow AudioContext復帰:',
                    error
                );
            }
        }
    }
);


/* ============================================================
   初期化
============================================================ */

window.addEventListener(
    'load',
    () => {

        renderCategoryButtons();

        updateSequenceUI();

        updateAudioDebug();

        console.log(
            '音声連続再生システム 初期化完了'
        );
    }
);

</script>
