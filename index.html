            height: 18px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .progress-transition {
            transition: width 0.08s linear;
        }

/* ============================================================
   選択状態
============================================================ */

let selectedCause = null;
let selectedSections = [];

/* ============================================================
   Web Audio API
============================================================ */

let audioContext = null;
let masterGain = null;

let audioBuffers = new Map();

let audioEngineReady = false;
let audioEngineInitializing = false;


/*
 * iPad SafariではAudioContextが
 * suspended状態になることがあるため、
 * 何度でもresumeできるようにする。
 */
async function ensureAudioContext() {
    if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
            throw new Error("このブラウザはWeb Audio APIに対応していません。");
        }
        audioContext = new AudioContextClass();
        masterGain = audioContext.createGain();
        masterGain.gain.value = masterVolume;
        masterGain.connect(audioContext.destination);
    }

    // suspended の場合は確実に resume を待つ
    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    // iOS Safari用のアンロック処理（確実に再生される小さなバッファを出力）
    if (audioContext.state === "running") {
        try {
            const buffer = audioContext.createBuffer(1, 1, 22050);
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start(0);
        } catch (error) {
            console.warn("Audio unlock buffer error:", error);
        }
    }

    return audioContext;
}

/* ============================================================
   音声一覧取得
============================================================ */

function getAllAudioItems() {

    const result = [];

    Object.values(categories).forEach(group => {

        group.forEach(item => {

            result.push(item);

        });

    });


    Object.values(fixedAudios).forEach(item => {

        result.push(item);

    });


    /*
     * path重複を除去
     */

    const unique = new Map();

    result.forEach(item => {

        if (!unique.has(item.path)) {
            unique.set(item.path, item);
        }

    });

    return Array.from(unique.values());
}


/* ============================================================
   音声1ファイルをデコード
============================================================ */

async function loadAudioBuffer(item) {

    if (audioBuffers.has(item.path)) {
        return audioBuffers.get(item.path);
    }


    const response =
        await fetch(
            encodeURI(item.path),
            {
                cache: "force-cache"
            }
        );


    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status}: ${item.path}`
        );
    }


    const arrayBuffer =
        await response.arrayBuffer();


    if (!arrayBuffer || arrayBuffer.byteLength === 0) {

        throw new Error(
            `空の音声ファイル: ${item.path}`
        );
    }


    /*
     * Safari対策として、
     * decodeAudioDataのPromise形式を使用。
     */

    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    if (!audioBuffer) {

        throw new Error(
            `デコード失敗: ${item.path}`
        );
    }


    audioBuffers.set(
        item.path,
        audioBuffer
    );


    return audioBuffer;
}


/* ============================================================
   全音声を事前デコード
============================================================ */

async function preloadAllAudios() {

    if (audioEngineInitializing) {
        return;
    }

    audioEngineInitializing = true;
    audioEngineReady = false;


    try {

        await ensureAudioContext();


        const items =
            getAllAudioItems();

        const total =
            items.length;

        let loaded = 0;
        let failed = [];


        updatePreparationUI(
            0,
            total,
            "音声を読み込んでいます"
        );


        /*
         * iPadで大量のfetch/decodeを同時に行うと
         * メモリ負荷が上がるため、
         * 1ファイルずつ順番にデコードする。
         */

        for (const item of items) {

            try {

                await loadAudioBuffer(item);

                loaded++;

            } catch (error) {

                console.error(
                    "音声準備失敗:",
                    item.path,
                    error
                );

                failed.push(item);

            }


            updatePreparationUI(
                loaded + failed.length,
                total,
                `音声を準備中 ${loaded + failed.length}/${total}`
            );
        }


        if (failed.length > 0) {

            audioEngineReady =
                audioBuffers.size > 0;

            setPreparationError(
                failed
            );

        } else {

            audioEngineReady = true;

            setPreparationSuccess(
                `${loaded}ファイルの準備が完了しました`
            );
        }


    } catch (error) {

        console.error(
            "音声エンジン初期化エラー:",
            error
        );

        audioEngineReady = false;

        setPreparationFatalError(
            error.message
        );

    } finally {

        audioEngineInitializing = false;
    }
}

function isItemSelected(
    groupType,
    item
) {

    if (groupType === "cause") {

        return (
            selectedCause &&
            selectedCause.id === item.id
        );
    }


    if (groupType === "section") {

        return selectedSections.some(
            section =>
                section.id === item.id
        );
    }


    if (groupType === "status") {

        return (
            selectedStatus &&
            selectedStatus.id === item.id
        );
    }


    return false;
}


/* ============================================================
   HTMLエスケープ
============================================================ */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ============================================================
   選択
============================================================ */

function handleSelect(
    groupType,
    item
) {

    if (isPlayingQueue) {

        showMessage(
            "再生中は選択を変更できません。"
        );

        return;
    }


    if (groupType === "cause") {

        selectedCause =
            selectedCause &&
            selectedCause.id === item.id
                ? null
                : item;

    }


    else if (groupType === "section") {

        const index =
            selectedSections.findIndex(
                section =>
                    section.id === item.id
            );


        if (index >= 0) {

            selectedSections.splice(
                index,
                1
            );

        } else {

            if (
                selectedSections.length >= 2
            ) {

                selectedSections.shift();

            }

            selectedSections.push(
                item
            );
        }

    }


    else if (groupType === "status") {

        selectedStatus =
            selectedStatus &&
            selectedStatus.id === item.id
                ? null
                : item;
    }


    renderCategoryButtons();

    updateSequenceUI();
}

    const queue = [];


    queue.push(
        fixedAudios["1"]

    if (selectedCause) {

        queue.push(
            selectedCause
        );
    }


    queue.push(
        fixedAudios["2"]
    );


    if (selectedSections[0]) {

        queue.push(
            selectedSections[0]
        );
    }


    queue.push(
        fixedAudios["3"]
    );


    if (selectedSections[1]) {

        queue.push(
            selectedSections[1]
        );
    }


    queue.push(
        fixedAudios["4"]
    );


    if (selectedStatus) {

        queue.push(
            selectedStatus
        );
    }


    return queue;
}

/* ============================================================
   音声ソース停止
============================================================ */

function stopCurrentSource() {

    if (!currentSource) {
        return;
    }


    try {

        currentSource.onended = null;

        currentSource.stop();

    } catch (error) {

        /*
         * すでに停止済みの場合は無視
         */

    }


    try {

        currentSource.disconnect();

    } catch (error) {}


    currentSource = null;
}


/* ============================================================
   タイマー解除
============================================================ */

function clearPlaybackTimers() {

    if (playbackTimeoutId) {

        clearTimeout(
            playbackTimeoutId
        );

        playbackTimeoutId = null;
    }


    if (countdownTimerId) {

        clearInterval(
            countdownTimerId
        );

        countdownTimerId = null;
    }


    if (progressAnimationId) {

        cancelAnimationFrame(
            progressAnimationId
        );

        progressAnimationId = null;
    }
}


/* ============================================================
   再生開始
============================================================ */

async function playQueueSequence() {
    if (!isSelectionComplete() || isPlayingQueue) return;

    // ユーザー操作の直後に直接 AudioContext を有効化
    try {
        await ensureAudioContext();
        if (audioContext.state !== "running") {
            await audioContext.resume();
        }
    } catch (error) {
        showMessage("iPadの音声機能を開始できませんでした。");
        return;
    }

    if (!audioEngineReady) {
        showMessage("まだ音声の準備が完了していません。");
        return;
    }

    // 以降の再生処理...

        /*
         * ユーザー操作時なので、
         * ここでもAudioContextをresumeする。
         */

        try {

            await ensureAudioContext();

        } catch (error) {}

        return;
    }


    /*
     * iPad Safari対策。
     *
     * Playボタン押下時にも必ずresume。
     */

    try {

        await ensureAudioContext();

    } catch (error) {

        showMessage(
            "iPadの音声機能を開始できませんでした。"
        );

        return;
    }


    if (
        !audioContext ||
        audioContext.state !== "running"
    ) {

        showMessage(
            "音声エンジンが起動していません。もう一度再生ボタンを押してください。"
        );

        return;
    }


    clearPlaybackTimers();

    stopCurrentSource();


    playbackSessionId++;

    const session =
        playbackSessionId;


    isPlayingQueue = true;

    currentQueueIndex = 0;


    playQueueBtn.disabled = true;

    stopQueueBtn.disabled = false;


    playQueueIcon.className =
        "fa-solid fa-rotate animate-spin text-xl";


    setStatus(
        "再生中",
        "emerald"
    );


    playNextInQueue(
        session
    );
}


/* ============================================================
   次の音声
============================================================ */

async function playNextInQueue(
    session
) {

    if (
        !isPlayingQueue ||
        session !== playbackSessionId
    ) {

        return;
    }


    const queue =
        buildPlayQueue();


    if (
        currentQueueIndex >= queue.length
    ) {

        handleQueueFinished(
            session
        );

        return;
    }


    const item =
        queue[currentQueueIndex];


    const buffer =
        audioBuffers.get(
            item.path
        );


    if (!buffer) {

        showMessage(
            `音声が準備されていません: ${item.path}`
        );


        currentQueueIndex++;


        setTimeout(
            () => {

                playNextInQueue(
                    session
                );

            },
            50
        );


        return;
    }


    /*
     * 再生直前にAudioContextの状態確認。
     */

    try {

        if (
            audioContext.state !== "running"
        ) {

            await audioContext.resume();
        }

    } catch (error) {

        console.warn(
            "resume error:",
            error
        );
    }


    if (
        !isPlayingQueue ||
        session !== playbackSessionId
    ) {

        return;
    }


    stopCurrentSource();


    const source =
        audioContext.createBufferSource();


    source.buffer =
        buffer;


    source.connect(
        masterGain
    );


    currentSource =
        source;


    currentSourceStartTime =
        audioContext.currentTime;


    currentPlayingLabel.textContent =
        `再生中 (${currentQueueIndex + 1}/${queue.length}): ${item.id}`;


    queueProgressCount.textContent =
        `${currentQueueIndex + 1} / ${queue.length}`;


    queueProgressBar.style.width =
        `${(currentQueueIndex / queue.length) * 100}%`;


    /*
     * onendedは必ず設定してからstartする。
     */

    source.onended =
        function() {

            if (
                session !== playbackSessionId ||
                !isPlayingQueue
            ) {

                return;
            }


            if (
                currentSource === source
            ) {

                currentSource = null;
            }


            currentQueueIndex++;


            /*
             * setTimeoutを0にすることで、
             * Safariのイベント処理を一度返してから
             * 次のAudioBufferSourceを開始する。
             *
             * gapを作らないための重要な処理。
             */

            setTimeout(
                () => {

                    playNextInQueue(
                        session
                    );

                },
                0
            );
        };


    /*
     * AudioBufferSourceNodeはstartしたら
     * 使い捨てなので毎回新しく生成する。
     */

    try {

        source.start(0);

    } catch (error) {

        console.error(
            "AudioBufferSource start error:",
            error
        );

        showMessage(
            `音声再生開始に失敗しました: ${item.id}`
        );


        currentQueueIndex++;


        setTimeout(
            () => {

                playNextInQueue(
                    session
                );

            },
            50
        );


        return;
    }


    /*
     * 進捗表示
     */

    updatePlaybackProgress(
        session,
        buffer.duration
    );
}


/* ============================================================
   進捗表示
============================================================ */

function updatePlaybackProgress(
    session,
    duration
) {

    if (
        !isPlayingQueue ||
        session !== playbackSessionId ||
        !audioContext ||
        !currentSource
    ) {

        return;
    }


    const elapsed =
        audioContext.currentTime -
        currentSourceStartTime;


    const localProgress =
        Math.min(
            Math.max(
                elapsed / duration,
                0
            ),
            1
        );


    const queue =
        buildPlayQueue();


    const overallProgress =
        (
            currentQueueIndex +
            localProgress
        ) /
        queue.length;


    queueProgressBar.style.width =
        `${overallProgress * 100}%`;


    progressAnimationId =
        requestAnimationFrame(
            () => {

                updatePlaybackProgress(
                    session,
                    duration
                );

            }
        );
}


/* ============================================================
   キュー終了
============================================================ */

function handleQueueFinished(
    session
) {

    if (
        session !== playbackSessionId
    ) {

        return;
    }


    clearPlaybackTimers();

    stopCurrentSource();


    if (
        isLoopEnabled
    ) {

        startLoopWait();

        return;
    }


    finishQueue();
}


/* ============================================================
   完了
============================================================ */

function finishQueue() {

    isPlayingQueue = false;


    clearPlaybackTimers();

    stopCurrentSource();


    currentQueueIndex = -1;


    playQueueIcon.className =
        "fa-solid fa-play text-xl";


    stopQueueBtn.disabled =
        true;


    if (
        isSelectionComplete() &&
        audioEngineReady
    ) {

        playQueueBtn.disabled =
            false;
    }


    currentPlayingLabel.textContent =
        "再生完了！";


    const queue =
        buildPlayQueue();


    queueProgressBar.style.width =
        "100%";


    queueProgressCount.textContent =
        `${queue.length} / ${queue.length}`;


    setStatus(
        "完了",
        "indigo"
    );
}


/* ============================================================
   ループ待機
============================================================ */

function startLoopWait() {

    clearPlaybackTimers();


    if (
        !isPlayingQueue
    ) {

        return;
    }


    remainingCountdown =
        loopIntervalSeconds;


    setStatus(
        "ループ待機中",
        "amber"
    );


    if (
        remainingCountdown <= 0
    ) {

        restartQueue();

        return;
    }


    updateCountdownLabel();


    countdownTimerId =
        setInterval(
            function() {

                if (
                    !isPlayingQueue
                ) {

                    clearInterval(
                        countdownTimerId
                    );

                    countdownTimerId = null;

                    return;
                }


                remainingCountdown--;


                if (
                    remainingCountdown <= 0
                ) {

                    clearInterval(
                        countdownTimerId
                    );

                    countdownTimerId = null;


                    restartQueue();

                } else {

                    updateCountdownLabel();
                }

            },
            1000
        );
}


/* ============================================================
   ループ再開
============================================================ */

function restartQueue() {

    if (
        !isPlayingQueue
    ) {

        return;
    }


    clearPlaybackTimers();

    currentQueueIndex = 0;


    queueProgressBar.style.width =
        "0%";


    setStatus(
        "再生中",
        "emerald"
    );


    playbackSessionId++;


    playNextInQueue(
        playbackSessionId
    );
}


/* ============================================================
   カウントダウン
============================================================ */

function updateCountdownLabel() {

    currentPlayingLabel.textContent =
        `ループ再生待機中 (${remainingCountdown}秒後に再再生)...`;
}


/* ============================================================
   停止
============================================================ */

function stopQueue() {

    playbackSessionId++;


    isPlayingQueue =
        false;


    clearPlaybackTimers();

    stopCurrentSource();


    currentQueueIndex =
        -1;


    playQueueIcon.className =
        "fa-solid fa-play text-xl";


    stopQueueBtn.disabled =
        true;


    if (
        isSelectionComplete() &&
        audioEngineReady
    ) {

        playQueueBtn.disabled =
            false;

    } else {

        playQueueBtn.disabled =
            true;
    }


    currentPlayingLabel.textContent =
        "再生停止";


    setStatus(
        "準備完了",
        "indigo"
    );
}


/* ============================================================
   再生ボタン
============================================================ */

playQueueBtn.addEventListener(
    "click",
    function() {

        playQueueSequence();

    }
);


stopQueueBtn.addEventListener(
    "click",
    function() {

        stopQueue();

    }
);


/* ============================================================
   音量
============================================================ */

masterVolumeInput.addEventListener(
    "input",
    function(event) {

        masterVolume =
            parseFloat(
                event.target.value
            );


        if (
            masterGain
        ) {

            /*
             * setTargetAtTimeを使用して
             * 急激なクリックノイズを避ける。
             */

            masterGain.gain.setTargetAtTime(
                masterVolume,
                audioContext.currentTime,
                0.01
            );
        }


        masterVolumeVal.textContent =
            `${Math.round(masterVolume * 100)}%`;


        if (
            masterVolume <= 0
        ) {

            volumeIcon.className =
                "fa-solid fa-volume-xmark text-slate-400 text-sm";

        } else if (
            masterVolume < 0.5
        ) {

            volumeIcon.className =
                "fa-solid fa-volume-low text-slate-400 text-sm";

        } else {

            volumeIcon.className =
                "fa-solid fa-volume-high text-slate-400 text-sm";
        }
    }
);


/* ============================================================
   ループ設定
============================================================ */

loopEnableToggle.addEventListener(
    "change",
    function(event) {

        isLoopEnabled =
            event.target.checked;


        if (
            isLoopEnabled
        ) {

            loopSettingsArea.classList.remove(
                "opacity-40",
                "pointer-events-none"
            );

        } else {

            loopSettingsArea.classList.add(
                "opacity-40",
                "pointer-events-none"
            );


            if (
                isPlayingQueue
            ) {

                /*
                 * ループをOFFにした場合、
                 * 現在の再生が終わったら終了する。
                 */

                clearPlaybackTimers();
            }
        }
    }
);


loopIntervalRange.addEventListener(
    "input",
    function(event) {

        loopIntervalSeconds =
            parseInt(
                event.target.value,
                10
            ) || 0;


        loopIntervalInput.value =
            loopIntervalSeconds;
    }
);


loopIntervalInput.addEventListener(
    "change",
    function(event) {

        let value =
            parseInt(
                event.target.value,
                10
            );


        if (
            !Number.isFinite(value)
        ) {

            value = 10;
        }


        value =
            Math.max(
                0,
                Math.min(
                    300,
                    value
                )
            );


        loopIntervalSeconds =
            value;


        loopIntervalInput.value =
            value;

        loopIntervalRange.value =
            value;
    }
);


/* ============================================================
   iPad / Safari 復帰対策
============================================================ */

document.addEventListener(
    "visibilitychange",
    async function() {

        if (
            document.visibilityState !== "visible"
        ) {

            return;
        }


        if (
            !audioContext
        ) {

            return;
        }


        try {

            if (
                audioContext.state !== "running"
            ) {

                await audioContext.resume();
            }

        } catch (error) {

            console.warn(
                "ページ復帰後のAudioContext resume失敗:",
                error
            );
        }
    }
);


/* ============================================================
   iOS Safariでページに戻ったとき
============================================================ */

window.addEventListener(
    "pageshow",
    async function() {

        if (
            audioContext &&
            audioContext.state !== "running"
        ) {

            try {

                await audioContext.resume();

            } catch (error) {

                console.warn(
                    "pageshow resume:",
                    error
                );
            }
        }
    }
);


/* ============================================================
   初期化
============================================================ */

window.addEventListener(
    "load",
    function() {

        renderCategoryButtons();

        updateSequenceUI();


        /*
         * ログイン前にはAudioContextを
         * 勝手に起動しない。
         *
         * iPad Safariではユーザー操作前の
         * AudioContext起動が問題になるため。
         */

        setStatus(
            "ログインしてください",
            "indigo"
        );
    }
);


/* ============================================================
   デバッグ用情報
============================================================ */

window.audioSystemDebug = {

    getContextState() {

        return audioContext
            ? audioContext.state
            : "not-created";
    },

    getBufferCount() {

        return audioBuffers.size;
    },

    getBufferPaths() {

        return Array.from(
            audioBuffers.keys()
        );
    },

    getMasterVolume() {

        return masterVolume;
    },

    isReady() {

        return audioEngineReady;
    }

};


/*
 * PC / iPadのSafariで確認する場合、
 * コンソールから
 *
 * audioSystemDebug.getContextState()
 *
 * を実行すると、
 *
 * "running"
 *
 * になっているか確認できる。
 */

</script>
